[project]
name = "zero-greptime-data"
description = "dbt views over GreptimeDB's dynamically-generated raw telemetry tables, grounded in a committed snapshot of prod's schema."
authors = [
    { name = "Floris Smit", email = "florissmit10@gmail.com" },
]
requires-python = ">= 3.12,<3.13"
readme = "README.md"
dependencies = [
    "dbt-core>=1.9.0,<1.10.0",
    "dbt-postgres>=1.9.0,<1.10.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "pydantic>=2.11.7,<3.0.0",
    "pydantic-settings>=2.7.1,<3.0.0",
]
dynamic = ["version"]

[project.scripts]
zero-greptime-data = "zero_greptime_data.__main__:run"

[dependency-groups]
dev = [
    "mypy>=1.14.1,<2",
    "ruff>=0.9.3,<0.10",
    "types-psycopg2>=2.9.21,<3",
]
test = [
    "pytest>=8.3.4,<9",
    "pytest-env>=1.1.5,<2",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.mypy]
plugins = "pydantic.mypy"
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
log_level = "DEBUG"
log_format = "%(asctime)s.%(msecs)03d | %(levelname)-8s | %(message)s"

[tool.ruff]
fix = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
search_parent_directories = true
fallback_version = "0.0.0"

[build-system]
requires = ["hatchling>=1.26,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"
