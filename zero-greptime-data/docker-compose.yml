# Local GreptimeDB for offline dbt development and the integration tests.
# Matches prod's engine/version (v1.1.3) and exposes the Postgres wire endpoint on :4003,
# which is what dbt and the snapshot tooling talk to. Start with `docker compose up -d`.
services:
  greptimedb:
    image: greptime/greptimedb:v1.1.3
    security_opt:
      - seccomp=unconfined
    ports:
      - "4000:4000"
      - "4001:4001"
      - "4002:4002"
      - "4003:4003"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:4000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: >
      standalone start
      --http-addr 0.0.0.0:4000
      --rpc-bind-addr 0.0.0.0:4001
      --mysql-addr 0.0.0.0:4002
      --postgres-addr 0.0.0.0:4003
