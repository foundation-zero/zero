apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zero-power-tags.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zero-power-tags.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "zero-power-tags.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "zero-power-tags.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 1001
      containers:
        - name: power-tags
          args: ["run"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MQTT_HOST
              value: {{ .Values.mqtt.host | quote }}
            - name: MQTT_PORT
              value: {{ .Values.mqtt.port | quote }}
            {{- if .Values.mqtt.username }}
            - name: MQTT_USERNAME
              value: {{ .Values.mqtt.username | quote }}
            {{- end }}
            {{- if .Values.mqtt.existingSecret }}
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mqtt.existingSecret }}
                  key: {{ .Values.mqtt.existingSecretPasswordKey }}
            {{- end }}
            - name: MODBUS_PORT
              value: {{ .Values.modbus.port | quote }}
            - name: MODBUS_PROBE_INTERVAL
              value: {{ .Values.modbus.probe_interval | quote }}
            - name: MODBUS_BRIDGES_PATH
              value: {{ .Values.modbus.bridgesPath | quote }}
            {{- if .Values.stub.enabled }}
            {{- $base := int .Values.modbus.port }}
            {{- $stubName := include "zero-power-tags.stub" . }}
            {{- range $index, $panel := .Values.stub.panels }}
            - name: MODBUS_PANELS__host_{{ $panel | lower }}
              value: {{ $stubName | quote }}
            - name: MODBUS_PANELS__port_{{ $panel | lower }}
              value: {{ add $base $index | quote }}
            {{- end }}
            {{- else }}
            {{- range $key, $panel := .Values.modbus.panels }}
            - name: MODBUS_PANELS__host_{{ $key | lower }}
              value: {{ $panel.host | quote }}
            {{- if $panel.port }}
            - name: MODBUS_PANELS__port_{{ $key | lower }}
              value: {{ $panel.port | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - emptyDir: {}
          name: tmp
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
