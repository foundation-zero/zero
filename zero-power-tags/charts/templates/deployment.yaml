apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zero-power-tags.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zero-power-tags.labels" . | nindent 4 }}
    app.kubernetes.io/component: run
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "zero-power-tags.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: run
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "zero-power-tags.labels" . | nindent 8 }}
        app.kubernetes.io/component: run
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 1001
      containers:
        - name: power-tags
          args: ["run"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MQTT_HOST
              value: {{ .Values.mqtt.host | quote }}
            - name: MQTT_PORT
              value: {{ .Values.mqtt.port | quote }}
            {{- if .Values.mqtt.existingSecret }}
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mqtt.existingSecret }}
                  key: username
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mqtt.existingSecret }}
                  key: {{ .Values.mqtt.existingSecretPasswordKey }}
            {{- end }}
            - name: MODBUS_PORT
              value: {{ .Values.modbus.port | quote }}
            - name: MODBUS_PROBE_INTERVAL
              value: {{ .Values.modbus.probe_interval | quote }}
            {{- include "zero-power-tags.panelEnv" . | trim | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # /health returns 204 while the MQTT broker is up, 500 otherwise; the
          # Modbus gateways are optional. The app logs the reason. Liveness
          # restarts the pod after 15 minutes not ready
          # (docs/adr/0001-dependency-outages.md).
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - emptyDir: {}
          name: tmp
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
