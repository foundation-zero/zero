replicaCount: 1

image:
  repository: europe-west1-docker.pkg.dev/common-449414/common/zero-power-tags
  pullPolicy: IfNotPresent
  tag: ""

mqtt:
  host: ""
  port: 1883
  username: power-tags
  existingSecret: ""
  existingSecretPasswordKey: password

modbus:
  port: 502
  probe_interval: 10
  # One gateway per panel; keys are sanitized panel names (panel 10P0.1 → key
  # 10p0_1) rendered as MODBUS_PANELS__host_<key> / MODBUS_PANELS__port_<key>
  # env vars. The addresses themselves live in the deployment repository.
  panels: {}
  # panels:
  #   10P0_1:
  #     host: "192.168.0.10"
  #     port: 502
  # Dummy-data mode (envs without hardware): deploy an extra stub workload and
  # Service (zero-power-tags-stub). Point each panel's host at that Service with
  # a distinct port.
  stub:
    enabled: false

resources: {}

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

nodeSelector: {}

tolerations: []

affinity: {}
