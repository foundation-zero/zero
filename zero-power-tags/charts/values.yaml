replicaCount: 1

image:
  repository: europe-west1-docker.pkg.dev/common-449414/common/zero-power-tags
  pullPolicy: IfNotPresent
  tag: ""

mqtt:
  host: ""
  port: 1883
  username: power-tags
  existingSecret: ""
  existingSecretPasswordKey: password

modbus:
  port: 502
  probe_interval: 10
  # One gateway per panel; keys are sanitized panel names (panel 10P0.1 → key
  # 10P0_1) rendered as MODBUS_HOST_<key> / MODBUS_PORT_<key> env vars. The
  # addresses themselves live in the deployment repository.
  panels: {}
  # panels:
  #   10P0_1:
  #     host: "192.168.0.10"
  #     port: 502

resources: {}

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

nodeSelector: {}

tolerations: []

affinity: {}
