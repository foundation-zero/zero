table:
  name: load_cases
  schema: loads
object_relationships:
  - name: awaRange
    using:
      foreign_key_constraint_on: awa_range_id
  - name: awsRange
    using:
      foreign_key_constraint_on: aws_range_id
array_relationships:
  - name: referenceValues
    using:
      foreign_key_constraint_on:
        column: load_case_id
        table:
          name: reference_values
          schema: loads
