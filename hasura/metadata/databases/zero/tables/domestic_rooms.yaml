table:
  name: rooms
  schema: domestic
object_relationships:
  - name: airConditioning
    using:
      manual_configuration:
        column_mapping:
          id: id
        insertion_order: null
        remote_table:
          name: air_conditioning
          schema: domestic
  - name: amplifier
    using:
      manual_configuration:
        column_mapping:
          id: id
        insertion_order: null
        remote_table:
          name: amplifiers
          schema: domestic
  - name: ventilation
    using:
      manual_configuration:
        column_mapping:
          id: id
        insertion_order: null
        remote_table:
          name: ventilation
          schema: domestic
array_relationships:
  - name: blinds
    using:
      foreign_key_constraint_on:
        column: room_id
        table:
          name: blinds
          schema: domestic
  - name: lightingGroups
    using:
      foreign_key_constraint_on:
        column: room_id
        table:
          name: lighting_groups
          schema: domestic
remote_relationships:
  - definition:
      to_remote_schema:
        lhs_fields:
          - id
        remote_field:
          airConditioningLog:
            arguments:
              roomId: $id
        remote_schema: domestic_control
    name: airConditioningLog
  - definition:
      to_remote_schema:
        lhs_fields:
          - id
        remote_field:
          amplifiersLog:
            arguments:
              roomId: $id
        remote_schema: domestic_control
    name: amplifiersLog
  - definition:
      to_remote_schema:
        lhs_fields:
          - id
        remote_field:
          blindsLog:
            arguments:
              roomId: $id
        remote_schema: domestic_control
    name: blindsLog
  - definition:
      to_remote_schema:
        lhs_fields:
          - id
        remote_field:
          lightingGroupsLog:
            arguments:
              roomId: $id
        remote_schema: domestic_control
    name: lightingGroupsLog
  - definition:
      to_remote_schema:
        lhs_fields:
          - id
        remote_field:
          ventilationLog:
            arguments:
              roomId: $id
        remote_schema: domestic_control
    name: ventilationLog
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - name
        - group
      filter:
        id:
          _eq: X-Hasura-Cabin
    comment: ""
