table:
  name: sensors
  schema: domestic
object_relationships:
  - name: room
    using:
      foreign_key_constraint_on: room_id
array_relationships:
  - name: roomSensorsLogs
    using:
      foreign_key_constraint_on:
        column: id
        table:
          name: room_sensors_log
          schema: domestic
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - room_id
        - type
        - name
      filter:
        room_id:
          _eq: X-Hasura-Cabin
    comment: ""
