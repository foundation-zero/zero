[project]
name = "iceburger"
version = "0.1.0"
description = ""
authors = [
    {name = "Boudewijn van Groos",email = "boudewijn.vangroos@foundationzero.org"}
]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "polars (>=1.38.1,<2.0.0)",
    "aio-pika (>=9.6.1,<10.0.0)",
    "pyiceberg (>=0.11.1,<0.12.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "pyarrow (>=23.0.1,<24.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "aiostream (>=0.7.1,<0.8.0)",
    "s3fs (>=2026.2.0,<2027.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.test.dependencies]
pytest-asyncio = "^1.3.0"


[tool.poetry.group.dev.dependencies]
pyright = "^1.1.408"
ruff = "^0.15.5"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]
log_level = "DEBUG"
log_format = "%(asctime)s.%(msecs)03d | %(levelname)-8s | %(message)s"
