[project]
name = "zero-prop-test"
version = "0.1.0"
description = ""
authors = [{ name = "Boudewijn van Groos", email = "boudewijn.vangroos@foundationzero.org" }]
requires-python = ">=3.12,<4"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "construct (>=2.10.70,<3.0.0)",
    "aiohttp (>=3.13.3,<4.0.0)",
    "aiomqtt (>=2.5.1,<3.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "pymodbustcp (>=0.3.0,<0.4.0)",
    "pyads (>=3.5.2,<4.0.0)",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
test = [
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",
]
dev = [
    "construct-typing>=0.7.0,<0.8",
    "pyright>=1.1.409",
    "ruff>=0.15.12",
]

[tool.uv]
default-groups = "all"


[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]
log_level = "DEBUG"
log_format = "%(asctime)s.%(msecs)03d | %(levelname)-8s | %(message)s"

