{{- if .Values.stub.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zero-hull-temperature.stub" . }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
  - name: modbus
    port: {{ .Values.stub.port }}
    targetPort: {{ .Values.stub.port }}
    protocol: TCP
  selector:
    {{- include "zero-hull-temperature.stubSelectorLabels" . | nindent 4 }}
{{- end }}
