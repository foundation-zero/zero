{{- if .Values.stub.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zero-hull-temperature.stub" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zero-hull-temperature.labels" . | nindent 4 }}
    app.kubernetes.io/component: stub
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "zero-hull-temperature.stubSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zero-hull-temperature.stubSelectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: hull-temperature-stub
          command: ["python", "-m", "zero_hull_temperature", "stub"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MQTT_HOST
              value: {{ .Values.mqtt.host | quote }}
            - name: MQTT_PORT
              value: {{ .Values.mqtt.port | quote }}
            {{- if .Values.mqtt.username }}
            - name: MQTT_USERNAME
              value: {{ .Values.mqtt.username | quote }}
            {{- end }}
            {{- if .Values.mqtt.existingSecret }}
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mqtt.existingSecret }}
                  key: {{ .Values.mqtt.existingSecretPasswordKey }}
            {{- end }}
            - name: MODBUS_HOST
              value: {{ .Values.stub.host | quote }}
            - name: MODBUS_PORT
              value: {{ .Values.modbus.port | quote }}
            - name: TEMPERATURE
              value: {{ .Values.stub.temperature | quote }}
            - name: SECONDS
              value: {{ .Values.stub.seconds | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
