[project]
name = "zero-hull-temperature"
description = ""
authors = [
    { name = "Boudewijn van Groos", email = "boudewijn.vangroos@foundationzero.org" },
]
requires-python = ">= 3.13.1,<4.0"
readme = "README.md"
dependencies = [
    "zero-modbus-bridge",
    "aiomqtt>=2.4.0,<3.0.0",
    "jsonpath-ng>=1.7.0,<2.0.0",
    "pydantic>=2.11.7,<3.0.0",
    "pydantic-settings>=2.10.1,<3.0.0",
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "ruff>=0.12.7,<0.13",
    "pyright>=1.1.403,<2",
    "zero-modbus-bridge[tui]",
]
test = ["pytest-asyncio>=1.1.0,<2", "pytest>=8.4.1,<9", "requests>=2.32.0,<3"]

[tool.ruff]
fix = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]
log_level = "DEBUG"
log_format = "%(asctime)s.%(msecs)03d | %(levelname)-8s | %(message)s"

[build-system]
requires = ["hatchling>=1.26,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
search_parent_directories = true
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["zero_hull_temperature"]

[tool.uv]
default-groups = ["dev", "test"]

[tool.uv.sources]
zero-modbus-bridge = { path = "../zero-modbus-bridge", editable = true }
