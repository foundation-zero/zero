[package]
name = "zero-fiber-optics"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
asyncapi-rust = "0.4"
clap = { version = "4.5", features = ["derive"] }
config = "0.14"
dotenvy = "0.15"
env_logger = "0.10"
heck = "0.5"
log = "0.4"
nom = "7.1"
quick-xml = { version = "0.37", features = ["serialize"] }
rumqttc = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
tokio-stream = "0.1"
