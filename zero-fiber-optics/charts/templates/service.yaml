apiVersion: v1
kind: Service
metadata:
  name: {{ include "zero-fiber-optics.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zero-fiber-optics.labels" . | nindent 4 }}
    {{- with .Values.udp.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.udp.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ if .Values.udp.externalIPs }}LoadBalancer{{ else }}ClusterIP{{ end }}
  {{- with .Values.udp.externalIPs }}
  externalIPs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "zero-fiber-optics.selectorLabels" . | nindent 4 }}
  ports:
    {{- range $i, $port := .Values.udp.ports }}
    - name: udp-{{ $port }}
      port: {{ $port }}
      targetPort: {{ $port }}
      protocol: UDP
    {{- end }}
