replicaCount: 1

image:
  repository: europe-west1-docker.pkg.dev/common-449414/common/zero-alert-forwarder
  pullPolicy: IfNotPresent
  tag: ""

mysql:
  # Mirrors of the AMCS database; they take turns being polled.
  hosts: []
  port: 3306
  database: alerts
  # Secret holding the read-only AMCS credentials.
  existingSecret: ""
  existingSecretUsernameKey: username
  existingSecretPasswordKey: password

ntfy:
  url: https://ntfy.sh
  topic: ""
  # Optional Secret with an access token, for a self-hosted ntfy with auth.
  existingSecret: ""
  existingSecretTokenKey: token

forwarding:
  pollIntervalSeconds: 10
  minPriority: Warning
  updates:
    - Activated
  attempts: 3
  # Bounds one poll of one mirror, so a stalled database does not block the other.
  pollTimeoutSeconds: 10
  # Bounds the first poll, which reads the day so far to rebuild the alarm list.
  historyTimeoutSeconds: 60
  dryRun: false

mqtt:
  # Broker to publish the alarm list to, for zero-mqtt-graphql; empty publishes nothing.
  host: ""
  port: 1883
  # Optional Secret with the broker username and password.
  existingSecret: ""
  existingSecretUsernameKey: username
  existingSecretPasswordKey: password

alarmList:
  minPriority: Warning
  # Alarms that ended stay listed this long after their last change.
  windowMinutes: 60
  intervalSeconds: 5

livenessPath: /tmp/liveness
# Liveness is refreshed per notification, so this must exceed one notification's retries:
# attempts * 10s + (attempts - 1) * pollIntervalSeconds, and also pollTimeoutSeconds and historyTimeoutSeconds.
livenessMaxAgeSeconds: 120
# Created once polling is set up; gates a rolling update on the new pod being ready.
readinessPath: /tmp/ready

resources: {}

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

nodeSelector: {}

tolerations: []

affinity: {}
