apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "charts.fullname" . }}
  labels:
    {{- include "charts.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "charts.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "charts.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      priorityClassName: kiosk-critical
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.env }}
          env:
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}     
          {{- end }}            
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
          - name: vnc
            containerPort: 5900
            protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
          - name: tmp
            mountPath: /tmp
          - name: dshm
            mountPath: /dev/shm
          - name: dri
            mountPath: /dev/dri
          - name: input
            mountPath: /dev/input
          - name: udev
            mountPath: /run/udev
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
      # Prevents Chromium render process crashes by scaling up shared memory
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
      # Prevents Chromium render process crashes by scaling up shared memory
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
      # Mounts the graphics card / display render nodes
      - name: dri
        hostPath:
          path: /dev/dri
          type: Directory
      # Mounts the USB input devices (keyboards, touchscreens, mice)
      - name: input
        hostPath:
          path: /dev/input
          type: Directory
      # Mounts hardware device mapping details
      - name: udev
        hostPath:
          path: /run/udev
          type: DirectoryOrCreate
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - {{ .Values.nodeAffinity.hostname }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
