services:
  vernemq:
    image: vernemq/vernemq:2.0.0-alpine
    container_name: vernemq
    restart: always
    ports:
      - 1883:1883
      - 9001:9001
    profiles:
      - zero
      - data
      - domestic
      - loads
      - thrs
      - data-collection
    environment:
      DOCKER_VERNEMQ_ACCEPT_EULA: "yes"
      DOCKER_VERNEMQ_ALLOW_ANONYMOUS: "on"
      DOCKER_VERNEMQ_LISTENER__WS__DEFAULT: "0.0.0.0:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    profiles:
      - zero
      - data
      - domestic
      - loads
      - thrs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}

  grafana:
    build:
      context: ./zero-dashboards
    command: []
    ports:
      - "3000:3000"
    depends_on: []
    volumes:
      - "grafana:/var/lib/grafana"
      - "./grafana/electrical_flow.png:/usr/share/grafana/public/extra/electrical_flow.png"
      - "./grafana/boat_outline.png:/usr/share/grafana/public/extra/boat_outline.png"
      - "./grafana/grafana.ini:/etc/grafana/grafana.ini"
      - "./grafana/greptime.yaml:/etc/grafana/provisioning/datasources/greptime.yaml"
    profiles:
      - data
    environment:
      - GF_PLUGINS_PREINSTALL=marcusolsson-treemap-panel
    container_name: grafana
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'printf \"GET / HTTP/1.1\n\n\" > /dev/tcp/127.0.0.1/3001; exit $$?;'
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  hasura:
    build:
      context: ./hasura
    ports:
      - 8080:8080
    restart: always
    profiles:
      - zero
      - domestic
      - loads
    environment:
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://${PG_USER}:${PG_PASSWORD}@postgres:5432/postgres
      HASURA_GRAPHQL_ENABLE_CONSOLE: true
      HASURA_GRAPHQL_DEV_MODE: true
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_CONSOLE_ASSETS_DIR: /srv/console-assets
      HASURA_GRAPHQL_ADMIN_SECRET: myadminsecretkey
      HASURA_GRAPHQL_ENABLE_REMOTE_SCHEMA_PERMISSIONS: true
      HASURA_GRAPHQL_JWT_SECRET: '{ "type": "HS256", "key": "${JWT_SECRET}" }'
      HASURA_GRAPHQL_EXPERIMENTAL_FEATURES: naming_convention
      HASURA_GRAPHQL_DEFAULT_NAMING_CONVENTION: graphql-default
      HASURA_GRAPHQL_STREAMING_QUERIES_MULTIPLEXED_REFETCH_INTERVAL: 200
      PG_DATABASE_URL: postgres://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}
      REMOTE_SCHEMA_DOMESTIC: http://domestic-control-api:5100/graphql
    volumes:
      - ./hasura/metadata:/hasura-metadata
    depends_on:
      postgres:
        condition: service_healthy

  hass:
    image: ghcr.io/home-assistant/home-assistant:2026.5.4
    profiles:
      - zero
      - domestic
    volumes:
      - ./hass:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    ports:
      - 8123:8123
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8123/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- data ----
  data-gen:
    build:
      context: ./zero-data
    command: python -m zero_data generate-data
    profiles:
      - data
    environment:
      MQTT_HOST: vernemq
      MQTT_PORT: 1883
    depends_on:
      vernemq:
        condition: service_healthy

  dbt-gen:
    build:
      context: ./zero-data
    command: python -m zero_data generate-dbt
    profiles:
      - data
    depends_on:
      vernemq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ---- data collection ----
  vector:
    image: timberio/vector:0.54.0-debian
    profiles:
      - data-collection
    command: -c /etc/vector-config.yaml
    environment:
      MQTT_HOST: vernemq
      MQTT_PORT: 1883
      MQTT_USER: mqtt
      MQTT_PASSWORD: mqtt
      GREPTIMEDB_HOST: greptimedb
      GREPTIMEDB_PORT: 4000
    volumes:
      - ./vector/config.yaml:/etc/vector-config.yaml
      - ./vector/processing:/etc/vector/
    depends_on:
      vernemq:
        condition: service_healthy
      greptimedb:
        condition: service_healthy

  greptimedb:
    image: greptime/greptimedb:v1.1.3
    security_opt:
      - seccomp=unconfined
    environment:
      # You can manually copy in credentials for importing backups from gcp
      # Instructions can be found in edge-flux/apps/base/greptime-backup/README.md
      GOOGLE_APPLICATION_CREDENTIALS: /gcp-credentials.json
    ports:
      - "4000-4003:4000-4003"
    restart: always
    profiles:
      - data-collection
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      standalone start
      --http-addr 0.0.0.0:4000
      --rpc-bind-addr 0.0.0.0:4001
      --mysql-addr 0.0.0.0:4002
      --postgres-addr 0.0.0.0:4003

  # ---- domestic-control ----
  domestic-control-api:
    command: api
    build:
      context: ./zero-domestic-control
    ports:
      - 5100:5100
    profiles:
      - domestic
    depends_on:
      hass:
        condition: service_healthy
      vernemq:
        condition: service_healthy
    environment: &app_env
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}
      JWT_SECRET: ${JWT_SECRET}
      MQTT_HOST: vernemq
      MQTT_PORT: 1883
      HOME_ASSISTANT_URL: http://hass:8123/api
      HOME_ASSISTANT_WS_URL: ws://hass:8123/api/websocket
      HOME_ASSISTANT_TOKEN: ${HOME_ASSISTANT_TOKEN}
      AIR_CONDITIONING_HOST: domestic-control-stub
      AIR_CONDITIONING_PORT: 1502
      VENTILATION_HOST: domestic-control-stub
      VENTILATION_PORT: 1503
      GREPTIME_URL: mysql://app@greptimedb:4002/public
      CANBUS_IP: 127.0.0.1
      CANBUS_PORT: 55001
      CANBUS_BUFFER_SIZE: 1024

  domestic-control-control:
    command: control
    build:
      context: ./zero-domestic-control
    profiles:
      - domestic
    depends_on:
      hass:
        condition: service_healthy
      vernemq:
        condition: service_healthy
      domestic-control-stub:
        condition: service_started
    environment:
      <<: *app_env

  domestic-control-stub:
    command: stub
    build:
      context: ./zero-domestic-control
    profiles:
      - domestic
    depends_on:
      vernemq:
        condition: service_healthy
    environment:
      <<: *app_env

  # ---- loads ----
  loads-api:
    command: api
    build:
      context: .
      dockerfile: ./zero-loads-app/Dockerfile
    ports:
      - 5101:5101
    profiles:
      - loads
    environment:
      <<: *app_env
    depends_on:
      vernemq:
        condition: service_healthy

  loads-conditions-stub:
    command: conditions-stub
    build:
      context: .
      dockerfile: ./zero-loads-app/Dockerfile
    profiles:
      - loads-dev
    environment:
      <<: *app_env
    depends_on:
      vernemq:
        condition: service_healthy

  loads-at-sensors-stub:
    command: at-sensors-stub
    build:
      context: .
      dockerfile: ./zero-loads-app/Dockerfile
    profiles:
      - loads
    environment:
      <<: *app_env
    depends_on:
      vernemq:
        condition: service_healthy

  loads-fiber-optic-sensors-stub:
    command: fiber-optic-sensors-stub
    build:
      context: .
      dockerfile: ./zero-loads-app/Dockerfile
    profiles:
      - loads
    environment:
      <<: *app_env
    depends_on:
      vernemq:
        condition: service_healthy

  loads-sail-system-sensors-stub:
    command: sail-system-sensors-stub
    build:
      context: .
      dockerfile: ./zero-loads-app/Dockerfile
    profiles:
      - loads
    environment:
      <<: *app_env
    depends_on:
      vernemq:
        condition: service_healthy

  # ---- THRS ----
  thrs-api:
    build:
      context: ./zero-thrs-control
      dockerfile: Dockerfile
      target: api
    profiles:
      - thrs
    ports:
      - "5102:5102"
    environment: &thrs_env
      MACHINE_STATE_LOGGING: ${MACHINE_STATE_LOGGING:-true}
      MQTT_HOST: vernemq
      MQTT_PORT: 1883
      MQTT_DEVICES_TOPIC_PREFIX: devices_topic
      MQTT_CONTROLLER_TOPIC_PREFIX: controller_topic
      MQTT_SIMULATOR_TOPIC_PREFIX: simulation_topic
      MQTT_CONTROL_TOPIC_SUFFIX: Command
      MQTT_CONTROLLER_TOPIC_SUFFIX: set
      MQTT_SIMULATOR_TOPIC_SUFFIX: set
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}
    depends_on:
      vernemq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  thrs-control-thrusters: &thrs_control
    pull_policy: never
    build:
      context: ./zero-thrs-control
      dockerfile: Dockerfile
      target: control
    profiles:
      - thrs
    environment:
      <<: *thrs_env
    depends_on:
      vernemq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["lockstep", "--mode=thrusters"]

  thrs-control-high-temperature:
    <<: *thrs_control
    profiles: ["thrs-extra"]
    command: ["lockstep", "--mode=high_temperature"]

  thrs-control-pvt:
    <<: *thrs_control
    profiles: ["thrs-extra"]
    command: ["lockstep", "--mode=pvt"]

  thrs-control-pcm:
    <<: *thrs_control
    profiles: ["thrs-extra"]
    command: ["lockstep", "--mode=pcm"]

  thrs-control-consumers:
    <<: *thrs_control
    profiles: ["thrs-extra"]
    command: ["lockstep", "--mode=consumers"]

  thrs-control-dhw:
    <<: *thrs_control
    profiles: ["thrs-extra"]
    command: ["lockstep", "--mode=dhw"]

  # ---- data collection (power tags) ----
  power-tags:
    build:
      context: .
      dockerfile: zero-power-tags/Dockerfile
    profiles:
      - data-collection
    environment:
      MODBUS_HOST: power-tags-stub
      MODBUS_PORT: "502"
      MODBUS_PROBE_INTERVAL: "10"
      MQTT_HOST: vernemq
      MQTT_PORT: "1883"
      MODBUS_BRIDGES_PATH: /app/zero-power-tags/modbus_bridges.json
    depends_on:
      vernemq:
        condition: service_healthy

  power-tags-stub:
    build:
      context: .
      dockerfile: zero-power-tags/Dockerfile
    command: stub
    profiles:
      - data-collection
    environment:
      MODBUS_HOST: "0.0.0.0"
      MODBUS_PORT: "502"

volumes:
  db_data:
  grafana:
