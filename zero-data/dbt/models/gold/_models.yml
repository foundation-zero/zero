version: 2

models:
  - name: gld_fixed_group_power
    description: >
      Power of every device whose main group and sub group are fixed, one row per sample, as the energy dashboards
      count it: shore (while a module runs), shore converter losses, solar (production only), thrusters (split
      into propulsion and hydrogeneration), the chiller and the 350 VDC network. A query averages per device and
      time bucket, then sums per group. No tests: each view it reads has them.
      Materialized as a view in the `views` database.
    columns:
      - name: ts
        description: "Ingest timestamp."
      - name: device
        description: "The device: an ESI module, solar converter, Aradex topic, chiller device or 350 VDC converter."
      - name: main_group
        description: "The main group: Shore, Losses, Solar, Propulsion, Hydrogeneration, HVAC or Domestic."
      - name: sub_group
        description: "The sub group, e.g. Shore power converter PS, Owners bimini or Thrusters."
      - name: power
        description: "Power in W, as the energy dashboards count it."
