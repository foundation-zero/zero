version: 2

sources:
  - name: raw
    description: >
      Raw telemetry tables in Greptime's `public` database. Vector infers the table name
      from the MQTT payload and Greptime infers the columns and types from the flattened,
      snakecased JSON — so these schemas are dynamically generated, not declared. Their
      shapes are pinned locally by the committed snapshot under `snapshot/`.
    database: greptime
    schema: public
    tables:
      - name: power_tags
        description: "Energy consumption from power tags."
        columns:
          - name: timestamp
            description: "Ingest time index. Always present; the raw-schema assumption we rely on."
            tests:
              - not_null
          - name: active_power_total
            description: "Total active power consumption."
          - name: component
            description: "Component identifier associated with the tag."
          - name: consumer
            description: "Consumer identifier associated with the tag."
          - name: current_a
            description: "Phase A current."
          - name: current_b
            description: "Phase B current."
          - name: current_c
            description: "Phase C current."
          - name: panel
            description: "Electrical panel identifier."
          - name: power_factor_total
            description: "Total power factor."
          - name: source_type
            description: "Source type reported by the device."
          - name: table
            description: "Table name associated with the raw message."
          - name: topic
            description: "MQTT topic associated with the raw message."
          - name: active_power_a
            description: "Phase A active power."
          - name: voltage_an
            description: "Phase A-to-neutral voltage."
          - name: active_power_b
            description: "Phase B active power."
          - name: active_power_c
            description: "Phase C active power."
          - name: voltage_bn
            description: "Phase B-to-neutral voltage."
          - name: voltage_cn
            description: "Phase C-to-neutral voltage."
      - name: marpower__450000_main_power_storage_errors
        description: "Main power storage errors and status telemetry from Marpower."
        columns:
          - name: timestamp
            description: "Ingest time index. Always present; the raw-schema assumption we rely on."
            tests:
              - not_null
          - name: alert_mode__has_value
            description: "Indicates if the alert mode attribute contains a value."
          - name: alert_mode__is_valid
            description: "Indicates if the alert mode value is valid."
          - name: alert_mode__timestamp
            description: "Source timestamp of the alert mode status update."
          - name: alert_mode__value
            description: "Boolean flag indicating if the system is in alert mode."
          - name: aside_current_average__has_value
            description: "Indicates if the A-side average current contains a value."
          - name: aside_current_average__is_valid
            description: "Indicates if the A-side average current value is valid."
          - name: aside_current_average__timestamp
            description: "Source timestamp of the A-side average current measurement."
          - name: aside_current_average__value
            description: "Average current measured on side A of the storage system (Amperes)."
          - name: aside_voltage_average__has_value
            description: "Indicates if the A-side average voltage contains a value."
          - name: aside_voltage_average__is_valid
            description: "Indicates if the A-side average voltage value is valid."
          - name: aside_voltage_average__timestamp
