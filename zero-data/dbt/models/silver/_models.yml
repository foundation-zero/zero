version: 2

models:
  - name: slv_power_tags
    description: >
      Power-tag enriched with metadata: electrical consumption measures with main- and sub-group classifications.
      Materialized as a view in the `views` database.
    columns:
      - name: ts
        description: "Ingest timestamp."
        tests:
          - not_null
      - name: topic
        description: "MQTT topic associated with the raw message."
        tests:
          - not_null
      - name: consumer
        description: "Consumer identifier associated with the tag."
      - name: active_power_total
        description: "Total active power consumption."
        tests:
          - not_null
      - name: main_group
        description: "The main group classification of the power tag."
      - name: sub_group
        description: "The sub group classification, within the main group, of the power tag."
  - name: slv_batteries
    description: >
      Battery metrics enriched with metadata.
      Materialized as a view in the `views` database.
    columns:
      - name: ts
        description: "Ingest timestamp."
        tests:
          - not_null
      - name: topic
        description: "MQTT topic associated with the raw message."
        tests:
          - not_null
      - name: soc
        description: "State of charge of the battery."
      - name: soh
        description: "State of health of the battery."
      - name: num_connected_strings
        description: "Number of connected battery strings."
      - name: energy
        description: "Energy stored in the battery."
      - name: charging
        description: "Indicates if the battery is charging."
      - name: discharging
        description: "Indicates if the battery is discharging."
      - name: charge_power
        description: "Power used for charging the battery."
      - name: battery_power
        description: "Total power of the battery."
  - name: slv_24vdc_currents
    description: >
      24V DC system output currents enriched with metadata.
      Materialized as a view in the `views` database.
    columns:
      - name: ts
        description: "Ingest timestamp."
        tests:
          - not_null
      - name: topic
        description: "MQTT topic associated with the raw message."
        tests:
          - not_null
      - name: output_current
        description: "Output current of the 24V DC system."
        tests:
          - not_null
      - name: converter
        description: "The converter associated with the 24V DC tag."
        tests:
          - not_null
      - name: main_group
        description: "The main group classification of the 24V DC tag."
        tests:
          - not_null
      - name: sub_group
        description: "The sub group classification, within the main group, of the 24V DC tag."
  - name: slv_24vdc_converter_voltages
    description: >
      24V DC system converter voltages enriched with metadata.
      Materialized as a view in the `views` database.
    columns:
      - name: ts
        description: "Ingest timestamp."
        tests:
          - not_null
      - name: topic
        description: "MQTT topic associated with the raw message."
        tests:
          - not_null
      - name: voltage
        description: "Voltage of the 24V DC system. This value is checked if above 18 Volts to validate the measurement."
        tests:
          - not_null
      - name: converter
        description: "The converter associated with the 24V DC tag."
        tests:
          - not_null
      - name: converter_subnr
        description: "The sub-number of the converter associated with the 24V DC tag."
        tests:
          - not_null
  - name: slv_pcs_aradexes
    description: >
      PCS power measurements of the AFT and FWD Aradexes.
      Materialized as a view in the `views` database.
    columns:
      - name: ts
        description: "Ingest timestamp."
        tests:
          - not_null
      - name: topic
        description: "MQTT topic associated with the raw message."
        tests:
          - not_null
      - name: thruster
        description: "The thruster associated with the PCS Aradex."
        tests:
          - not_null
      - name: aradex
        description: "The Aradex number associated with the PCS."
        tests:
          - not_null
      - name: power
        description: "Power measurement of the PCS Aradex."
        tests:
          - not_null
