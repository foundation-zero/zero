version: 2

models:
  - name: slv_power_tags
    description: >
      Active power of each power tag. Its main group and sub group in power_tag_metadata are joined by the query
      that reads this view, after averaging per topic and time bucket.
      Materialized as a view in the `views` database.
    columns:
      - name: ts
        description: "Ingest timestamp."
        tests:
          - not_null
      - name: topic
        description: "MQTT topic associated with the raw message."
        tests:
          - not_null
      - name: panel
        description: "Panel identifier associated with the tag."
      - name: consumer
        description: "Consumer identifier associated with the tag."
      - name: active_power_total
        description: "Total active power consumption in W."
        tests:
          - not_null
  - name: slv_batteries
    description: >
      Battery metrics enriched with metadata.
      Materialized as a view in the `views` database.
    columns:
      - name: ts
        description: "Ingest timestamp."
        tests:
          - not_null
      - name: topic
        description: "MQTT topic associated with the raw message."
        tests:
          - not_null
      - name: soc
        description: "State of charge of the battery."
      - name: soh
        description: "State of health of the battery."
      - name: num_connected_strings
        description: "Number of connected battery strings."
      - name: energy
        description: "Energy stored in the battery."
      - name: charging
        description: "Indicates if the battery is charging."
      - name: discharging
        description: "Indicates if the battery is discharging."
      - name: charge_power
        description: "Power used for charging the battery."
      - name: battery_power
        description: "Total power of the battery."
  - name: slv_24vdc_currents
    description: >
      Output current of each 24 VDC breaker channel. Its converter, main group and sub group in dc_24v_metadata are
      joined by the query that reads this view, after averaging per topic and time bucket.
      Materialized as a view in the `views` database.
    columns:
      - name: ts
        description: "Ingest timestamp."
        tests:
          - not_null
      - name: topic
        description: "MQTT topic associated with the raw message."
        tests:
          - not_null
      - name: output_current
        description: "Output current of the 24V DC device."
        tests:
          - not_null
  - name: slv_24vdc_converter_voltages
    description: >
      Output voltage of each 24 VDC power supply. Its converter and converter_subnr in dc_24v_metadata are joined by
      the query that reads this view, after averaging per topic and time bucket.
      Materialized as a view in the `views` database.
    columns:
      - name: ts
        description: "Ingest timestamp."
        tests:
          - not_null
      - name: topic
        description: "MQTT topic associated with the raw message."
        tests:
          - not_null
      - name: voltage
        description: "Voltage of the 24V DC system. This value is checked if above 18 Volts to validate the measurement."
        tests:
          - not_null
  - name: slv_pcs_aradexes
    description: >
      PCS power measurements of the AFT and FWD Aradexes.
      Materialized as a view in the `views` database.
    columns:
      - name: ts
        description: "Ingest timestamp."
        tests:
          - not_null
      - name: topic
        description: "MQTT topic associated with the raw message."
        tests:
          - not_null
      - name: thruster
        description: "The thruster associated with the PCS Aradex."
        tests:
          - not_null
      - name: aradex
        description: "The Aradex number associated with the PCS."
        tests:
          - not_null
      - name: power
        description: "Power measurement of the PCS Aradex."
        tests:
          - not_null
  - name: slv_solar_converters
    description: >
      Power the solar EPC converters on the main and owners biminis deliver to the main DC bus.
      Materialized as a view in the `views` database.
    columns:
      - name: ts
        description: "Ingest timestamp."
        tests:
          - not_null
      - name: topic
        description: "MQTT topic associated with the raw message."
        tests:
          - not_null
      - name: converter
        description: "The solar EPC converter, e.g. epc-31-t101."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["epc-31-t101", "epc-32-t101", "epc-32-t102"]
      - name: bimini
        description: "The bimini whose solar panels feed the converter."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Main bimini", "Owners bimini"]
      - name: power
        description: "Power the converter delivers to the main DC bus in W: the HVDC (bus side) power with its sign flipped, so production is positive and draw from the bus negative."
        tests:
          - not_null
  - name: slv_shore_power_converters
    description: >
      Both sides of each ESI shore power converter module: the AC power it draws from shore, the DC power it
      delivers to the 700 VDC bus, and its running state.
      Materialized as a view in the `views` database.
    columns:
      - name: ts
        description: "Ingest timestamp."
        tests:
          - not_null
      - name: topic
        description: "MQTT topic associated with the raw message."
        tests:
          - not_null
      - name: module
        description: "The ESI converter module, e.g. 07-11-tbc1a."
        tests:
          - not_null
      - name: converter
        description: "The shore power converter the module belongs to: PS (07-11) or SB (07-12)."
        tests:
          - not_null
      - name: running
        description: "Whether the module runs. An idle module's DC power is a sensor offset, not a flow."
        tests:
          - not_null
      - name: ac_power
        description: "3-phase AC active power the module draws from shore in W. TODO: the source reports kW and is converted here; remove the conversion once the source reports W."
        tests:
          - not_null
      - name: dc_power
        description: "DC power the module delivers to the 700 VDC bus in W: battery-side current × voltage."
        tests:
          - not_null
  - name: slv_chiller
    description: >
      Power of the compression chiller's two compressors and its seawater pump, one row per device.
      Materialized as a view in the `views` database.
    columns:
      - name: ts
        description: "Ingest timestamp."
        tests:
          - not_null
      - name: topic
        description: "MQTT topic associated with the raw message."
        tests:
          - not_null
      - name: device
        description: "The chiller device: Compressor 1, Compressor 2 or Seawater pump."
        tests:
          - not_null
      - name: power
        description: "Power of the device in W. The source reports kW and is converted here."
        tests:
          - not_null
  - name: slv_24vdc_power_supplies
    description: >
      Output power of each 24 VDC power supply. Its converter in dc_24v_metadata is joined by the query that reads
      this view, after averaging per topic and time bucket.
      Materialized as a view in the `views` database.
    columns:
      - name: ts
        description: "Ingest timestamp."
        tests:
          - not_null
      - name: topic
        description: "MQTT topic of the power supply."
        tests:
          - not_null
      - name: power
        description: "Output power of the power supply in W."
        tests:
          - not_null
  - name: slv_350vdc_converters
    description: >
      Power each 350 VDC converter draws from the 700 VDC bus. A converter can run backwards; only the sum
      over the four is the load of the 350 VDC network.
      Materialized as a view in the `views` database.
    columns:
      - name: ts
        description: "Ingest timestamp."
        tests:
          - not_null
      - name: topic
        description: "MQTT topic associated with the raw message."
        tests:
          - not_null
      - name: converter
        description: "The converter's designation, e.g. 02-71-t101."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["02-71-t101", "02-71-t102", "02-72-t101", "02-72-t102"]
      - name: power
        description: "HVDC (700 VDC side) power in W, positive from the 700 VDC bus to the 350 VDC network."
        tests:
          - not_null
  - name: slv_grid_converters
    description: >
      Power of the two grid converters on both sides in W: the DC input from the 700 VDC bus and the AC
      output into the 400 VAC switchboard, measured at its incoming breaker.
      Materialized as a view in the `views` database.
    columns:
      - name: ts
        description: "Ingest timestamp."
        tests:
          - not_null
      - name: topic
        description: "MQTT topic associated with the raw message."
        tests:
          - not_null
      - name: converter
        description: "The grid converter's designation; the AC breakers are mapped to the converter that feeds them."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["05-11-u101", "05-12-u101"]
      - name: side
        description: "'dc' for the input from the 700 VDC bus, 'ac' for the output into the 400 VAC switchboard."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["dc", "ac"]
      - name: power
        description: "Power in W, positive from the 700 VDC bus to the 400 VAC switchboard."
        tests:
          - not_null
  - name: slv_dc_ring_sources
    description: >
      The measured sources on the 700 VDC ring, one row per sample: what each device takes from the bus, so a source
      that feeds the bus is negative. dc_ring_source_metadata places each unit on its segment. The 24 VDC power
      supplies aren't in it: their unit, the converter, is in dc_24v_metadata. No tests: each view it reads has them.
      Materialized as a view in the `views` database.
    columns:
      - name: ts
        description: "Ingest timestamp."
      - name: kind
        description: "The kind of source: shore_converter, battery, grid_converter, dc_350v_converter, aradex or chiller."
      - name: unit
        description: "The unit within the source as dc_ring_source_metadata names it, e.g. 05-41 or AFT-1."
      - name: device
        description: "The device within the unit (module, pack, converter, Aradex, chiller device): a query averages per device, then sums per unit."
      - name: power
        description: "Power the device takes from the 700 VDC bus in W; negative when it feeds the bus."
  - name: slv_dc_ring_switches
    description: >
      Power through each DC switch of the 700 VDC ring (05.71–05.78): current × voltage, averaged over the switch's
      two sections. dc_ring_switch_metadata gives the sign and the segments on either side.
      Materialized as a view in the `views` database.
    columns:
      - name: ts
        description: "Ingest timestamp."
        tests:
          - not_null
      - name: topic
        description: "MQTT topic of the switch."
        tests:
          - not_null
      - name: technical_name
        description: "The switch, e.g. 05-71-q101."
        tests:
          - not_null
      - name: power
        description: "Power through the switch in W, positive from section 0 to section 1."
        tests:
          - not_null
