# dbt connects over Greptime's Postgres wire endpoint (:4003).
#
# Greptime's `dbname` selects the default database: raw tables live in `public`, models
# materialize into `views`. Relations render without a database part (see
# macros/greptime_relations.sql). Tiers differ only by host, so the shared settings live in
# one anchor. Deploy to a tier with `just dbt-deploy <tier>`.
zero_data_greptime:
  target: local
  outputs:
    # Local Greptime from docker-compose, seeded from the committed snapshot. Offline.
    local:
      <<: &greptime
        type: postgres
        port: "{{ env_var('GREPTIME_PG_PORT', '4003') | int }}"
        user: "{{ env_var('GREPTIME_USER', 'app') }}"
        password: "{{ env_var('GREPTIME_PASSWORD', '') }}"
        dbname: public
        schema: views
        threads: 4
        connect_timeout: 10
      host: "{{ env_var('GREPTIME_HOST', '127.0.0.1') }}"

    # ---- Greptime tiers over Tailscale ----
    greptime-subzero:
      <<: *greptime
      host: greptime-subzero.tail0b4840.ts.net

    greptime-singel:
      <<: *greptime
      host: greptime-singel.tail0b4840.ts.net

    greptime-zero:
      <<: *greptime
      host: greptime-zero.tail0b4840.ts.net
