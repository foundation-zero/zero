# dbt connects over Greptime's Postgres wire endpoint (:4003).
#
# Greptime's only catalog is `greptime`, and dbt-postgres uses the connected dbname as the
# leading catalog token of every rendered relation name — so we connect to a database
# literally named `greptime`, making all names render as `"greptime"."<schema>"."<table>"`.
# Models materialize into `views`, leaving `public` raw-ingest only. Tiers differ only by
# host, so the shared settings live in one anchor. See docs/greptime-views-viability-check.md.
zero_data_greptime:
  target: local
  outputs:
    # Local Greptime from docker-compose, seeded from the committed snapshot. Offline.
    local:
      <<: &greptime
        type: postgres
        port: "{{ env_var('GREPTIME_PG_PORT', '4003') | int }}"
        user: "{{ env_var('GREPTIME_USER', 'app') }}"
        password: "{{ env_var('GREPTIME_PASSWORD', '') }}"
        dbname: greptime
        schema: views
        threads: 4
        connect_timeout: 10
      host: "{{ env_var('GREPTIME_HOST', '127.0.0.1') }}"

    # ---- Greptime tiers over Tailscale (deploy is a follow-up ticket) ----
    greptime-subzero:
      <<: *greptime
      host: greptime-subzero.tail0b4840.ts.net

    greptime-singel:
      <<: *greptime
      host: greptime-singel.tail0b4840.ts.net

    # Prod / source-of-truth. Deploy is gated on prod PG credentials (follow-up).
    greptime-zero:
      <<: *greptime
      host: greptime-zero.tail0b4840.ts.net
