name: "zero_data_greptime"
version: "1.0.0"
config-version: 2

profile: "zero_data_greptime"

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

require-dbt-version: [">=1.10.0", "<2.0.0"]

# Models are logical views over the raw `public` tables, materialized into the dedicated
# `views` database. See docs/greptime-views-viability-check.md for why every model is a view.
models:
  zero_data_greptime:
    staging:
      +materialized: view
