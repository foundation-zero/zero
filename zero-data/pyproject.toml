[project]
name = "zero-data"
description = ""
authors = [
    { name = "Boudewijn van Groos", email = "boudewijn.vangroos@foundationzero.org" },
    { name = "Dustin van Weersel", email = "dustin.vanweersel@foundationzero.org" },
]
requires-python = ">=3.15.1,<4.0"
readme = "README.md"
dependencies = [
    "aiomqtt>=2.3.0,<3.0.0",
    "gspread>=6.2.1,<7.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "polars>=2.0.0,<3.0.0",
    "pydantic>=2.11.7,<3.0.0",
    "pydantic-settings>=2.7.1,<3.0.0",
    "jupyterlab>=4.5.0,<5.0.0",
    # Only `partition` is used (stable API); floor kept low so it can coexist with the
    # dbt tooling's metricflow, which pins more-itertools<11.
    "more-itertools>=10.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "stringcase~=1.2.0",
]
dynamic = ["version"]

[project.scripts]
zero-data = "zero_data.__main__:run"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5,<7",
    "mypy>=2.4,<3",
    "notebook>=7.3.2,<8",
    "pandas>=3.0.6,<4",
    "python-dotenv>=1.1.0,<2",
    "ruff>=0.17.2,<0.18",
    "types-openpyxl>=3.1.5.20250602,<4",
    "sqlalchemy>=2.0.43,<3",
    "adbc-driver-postgresql>=1.11.0,<2",
    "pyarrow>=26.0.0,<27",
    "dbt-core>=1.12.0,<2.0.0",
    "dbt-postgres>=1.11.0,<2.0.0",
    "marimo>=0.25.1",
    "pymysql>=1.2.3",
    "plotly>=7.1.0",
]
test = [
    "freezegun>=1.5.5,<2",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4,<1.5",
    "pytest-env>=1.1.5,<2",
    "pytest-mock>=3.14.0,<4",
    "pytest-cov>=7.0.0,<8",
]

[tool.mypy]
plugins = "pydantic.mypy"
check_untyped_defs = true

[tool.uv]
default-groups = ["dev", "test"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]
log_level = "DEBUG"
log_format = "%(asctime)s.%(msecs)03d | %(levelname)-8s | %(message)s"
markers = ["greptimedb: tests requiring a running greptimedb"]

[tool.coverage.run]
source = ["src/zero_data"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    'if __name__ == "__main__":',
    "@overload",
    "raise NotImplementedError",
    '^\s*\.\.\.$',
]

[tool.ruff]
fix = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I"]

[tool.dotenv]
location = ".env"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
search_parent_directories = true
fallback_version = "0.0.0"

[build-system]
requires = ["hatchling>=1.26,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"
