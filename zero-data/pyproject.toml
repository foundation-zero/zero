[project]
name = "zero-data"
description = ""
authors = [
    { name = "Boudewijn van Groos", email = "boudewijn.vangroos@foundationzero.org" },
    { name = "Dustin van Weersel", email = "dustin.vanweersel@foundationzero.org" },
]
requires-python = ">= 3.13.1,<4.0"
readme = "README.md"
dependencies = [
    "aiomqtt>=2.3.0,<3.0.0",
    "gspread>=6.2.1,<7.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "polars>=1.16.0,<2.0.0",
    "pydantic>=2.11.7,<3.0.0",
    "pydantic-settings>=2.7.1,<3.0.0",
    "jupyterlab>=4.5.0,<5.0.0",
    # Only `partition` is used (stable API); floor kept low so it can coexist with the
    # dbt tooling's metricflow, which pins more-itertools<11.
    "more-itertools>=10.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
]
dynamic = ["version"]

[project.scripts]
zero-data = "zero_data.__main__:run"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5,<7",
    "mypy>=1.14.1,<2",
    "notebook>=7.3.2,<8",
    "pandas>=2.2.3,<3",
    "python-dotenv>=1.1.0,<2",
    "ruff>=0.9.3,<0.10",
    "types-openpyxl>=3.1.5.20250602,<4",
    "sqlalchemy>=2.0.43,<3",
    "adbc-driver-postgresql>=1.11.0,<2",
    "pyarrow>=24.0.0,<25",
    "types-psycopg2>=2.9.21,<3",
    # dbt tooling for the Greptime views. In `dev` (not `test`) so it stays out of the
    # production data_gen image, which builds with UV_NO_DEV=1. Marked `< 3.14` because
    # dbt-core has no wheels for newer Pythons and this tooling runs on 3.13.
    "dbt-core>=1.12.0,<2.0.0; python_version < '3.14'",
    "dbt-postgres>=1.11.0,<2.0.0; python_version < '3.14'",
]
test = [
    "freezegun>=1.5.5,<2",
    "pytest>=8.3.4,<9",
    "pytest-asyncio>=0.25.3,<0.26",
    "pytest-env>=1.1.5,<2",
    "pytest-mock>=3.14.0,<4",
    "pytest-cov>=7.0.0,<8",
]

[tool.mypy]
plugins = "pydantic.mypy"
check_untyped_defs = true

[tool.uv]
default-groups = ["dev", "test"]

[tool.pytest.ini_options]
addopts = "--cov=zero_data --cov-report=html --cov-branch"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]
log_level = "DEBUG"
log_format = "%(asctime)s.%(msecs)03d | %(levelname)-8s | %(message)s"

[tool.ruff]
fix = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I"]

[tool.dotenv]
location = ".env"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
search_parent_directories = true
fallback_version = "0.0.0"

[build-system]
requires = ["hatchling>=1.26,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"
