server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # runtime config must never be cached: it is mounted per-deployment and a
    # stale copy silently pins the app to old API urls
    location = /env.json {
        add_header Cache-Control "no-store" always;
    }

    # assets should 404 if not found
    location ~* \.(?:css|js|json|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA requires fallback to index.html for non-file requests
    location / {
        try_files $uri $uri/ /index.html;
    }

    # avoid loops
    location = /index.html {
        internal;
    }
}
