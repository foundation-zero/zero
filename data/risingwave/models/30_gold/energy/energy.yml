version: 2
models:
  - name: electrical_flow
    description: Electrical energy consumption or production per group. The energy values are an average value over the past 5 minutes and summed up per group.
    columns:
      - name: time
        description: '{{ doc("time") }}'
        data_tests:
            - not_null
      - name: electrical_system
        description: '{{ doc("electrical_system") }}'
        data_tests:
            - not_null
      - name: group_name
        description: '{{ doc("group_name") }}'
      - name: sub_group_name
        description: '{{ doc("sub_group_name") }}'
      - name: group_power
        description: The sum of the average electrical energy values (W) of all measurements within a group.
        data_tests:
            - not_null
  - name: electrical_hourly
    description: Electrical energy consumed or produced per hour.
    columns:
      - name: electrical_system
        description: '{{ doc("electrical_system") }}'
        data_tests:
            - not_null
      - name: group_name
        description: '{{ doc("group_name") }}'
      - name: sub_group_name
        description: '{{ doc("sub_group_name") }}'
      - name: topic
        description: '{{ doc("topic") }}'
        data_tests:
            - not_null
      - name: hour
        description: The starttime of the hour time window.
        data_tests:
            - not_null
      - name: energy_wh
        description: Electrical energy (Wh) value within the hour time window.
        data_tests:
            - not_null
  - name: electrical_soc
    description: Electrical energy stored in a battery.
    columns:
      - name: time
        description: '{{ doc("time") }}'
        data_tests:
            - not_null
      - name: electrical_system
        description: '{{ doc("electrical_system") }}'
        data_tests:
            - not_null
      - name: topic
        description: '{{ doc("topic") }}'
        data_tests:
            - not_null
      - name: group_name
        description: '{{ doc("group_name") }}'
      - name: stored_energy
        description: The most recent value of the electrical energy stored (Wh).
        data_tests:
            - not_null
  - name: electrical_soc_hourly
    description: Electrical energy stored in a battery per day. 
    columns:
      - name: electrical_system
        description: '{{ doc("electrical_system") }}'
        data_tests:
            - not_null
      - name: group_name
        description: '{{ doc("group_name") }}'
      - name: sub_group_name
        description: '{{ doc("sub_group_name") }}'
      - name: topic
        description: '{{ doc("topic") }}'
        data_tests:
            - not_null
      - name: hour
        description: The starttime of the hour time window.
        data_tests:
            - not_null
      - name: soc
        description: The state of charge (kWh) within the hour time window.
        data_tests:
            - not_null
  - name: energy_metrics
    description: Energy metrics which are measured or calculated.
    columns:
      - name: avg_daily_consumption_timestamp
        description: The timestamp of the calculated average daily consumption.
        data_tests:
            - not_null
      - name: avg_daily_consumption
        description: The average daily consumption that is calculated at the specified timestamp.
        data_tests:
            - not_null
