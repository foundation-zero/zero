version: 2
models:
  - name: battery_dc_converter
    description: |
      Voltage and current measured by the battery DC converters.  
      {{ doc("dc_converter_sides_explained") }}  
      {{ doc("marpower_struct_explained") }}
    columns:
      - name: time
        description: '{{ doc("zero_timestamp") }}'
        data_tests:
            - not_null
      - name: Voltage_A
        description: '{{ doc("voltage_at_side") }} A.'
      - name: Voltage_B
        description: '{{ doc("voltage_at_side") }} B.'
      - name: Current_A
        description: '{{ doc("current_at_side") }} A.'
      - name: Current_B
        description: '{{ doc("current_at_side") }} B.'
      - name: topic
        description: '{{ doc("topic") }}'
        data_tests:
            - not_null
  - name: bms_master
    description: |
      The stored energy value updates of the batteries.  
      {{ doc("marpower_struct_explained") }}
    columns:
      - name: time
        description: '{{ doc("zero_timestamp") }}'
        data_tests:
            - not_null
      - name: Stored_Energy
        description: '{{ doc("stored_energy") }}'
      - name: topic
        description: '{{ doc("topic") }}'
        data_tests:
            - not_null
  - name: hydrogeneration
    description: |
      The electrical energy currently being generated by the thrusters.  
      {{ doc("marpower_struct_explained") }}
    columns:
      - name: time
        description: '{{ doc("zero_timestamp") }}'
        data_tests:
            - not_null
      - name: Total_Active_Power
        description: '{{ doc("total_active_power_prod") }}'
      - name: Total_Power_Factor
        description: '{{ doc("power_factor") }}'
      - name: topic
        description: '{{ doc("topic") }}'
        data_tests:
            - not_null
  - name: power_tag
    description: |
      The electrical energy consumption of devices on the AC grid, measured by the power tags.  
      {{ doc("marpower_struct_explained") }}
    columns:
      - name: time
        description: '{{ doc("zero_timestamp") }}'
        data_tests:
            - not_null
      - name: Active_Power_Phase_A
        description: '{{ doc("active_power_on_phase") }} A.'
      - name: Active_Power_Phase_B
        description: '{{ doc("active_power_on_phase") }} B.'
      - name: Active_Power_Phase_C
        description: '{{ doc("active_power_on_phase") }} C.'
      - name: Power_Factor_Phase_A
        description: '{{ doc("power_factor_on_phase") }} A.'
      - name: Power_Factor_Phase_B
        description: '{{ doc("power_factor_on_phase") }} B.'
      - name: Power_Factor_Phase_C
        description: '{{ doc("power_factor_on_phase") }} C.'
      - name: RMS_Current_Phase_A
        description: '{{ doc("rms_current_on_phase") }} A.'
      - name: RMS_Current_Phase_B
        description: '{{ doc("rms_current_on_phase") }} B.'
      - name: RMS_Current_Phase_C
        description: '{{ doc("rms_current_on_phase") }} C.'
      - name: RMS_Current_Phase_Neut
        description: '{{ doc("rms_current_on_phase") }} N.'
      - name: RMS_Voltage_A_N
        description: '{{ doc("rms_voltage_on_phase") }} A.'
      - name: RMS_Voltage_B_N
        description: '{{ doc("rms_voltage_on_phase") }} B.'
      - name: RMS_Voltage_C_N
        description: '{{ doc("rms_voltage_on_phase") }} C.'
      - name: Total_Active_Power
        description: '{{ doc("total_active_power_cons") }}'
      - name: Total_Power_Factor
        description: '{{ doc("power_factor") }}'
      - name: topic
        description: '{{ doc("topic") }}'
        data_tests:
            - not_null
  - name: pvt
    description: |
      The electrical energy currently being generated by the solar panels.  
      {{ doc("marpower_struct_explained") }}
    columns:
      - name: time
        description: '{{ doc("zero_timestamp") }}'
        data_tests:
            - not_null
      - name: Total_Active_Power
        description: '{{ doc("total_active_power_prod") }}'
      - name: Total_Power_Factor
        description: '{{ doc("power_factor") }}'
      - name: topic
        description: '{{ doc("topic") }}'
        data_tests:
            - not_null
  - name: shore_power
    description: |
      The electrical energy currently being supplied by the shore power connection.  
      {{ doc("marpower_struct_explained") }}
    columns:
      - name: time
        description: '{{ doc("zero_timestamp") }}'
        data_tests:
            - not_null
      - name: Total_Active_Power
        description: '{{ doc("total_active_power_prod") }}'
      - name: Total_Power_Factor
        description: '{{ doc("power_factor") }}'
      - name: topic
        description: '{{ doc("topic") }}'
        data_tests:
            - not_null
