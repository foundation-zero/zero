[project]
name = "zero-termodinamica"
description = ""
readme = "README.md"
authors = [
    { name = "Floris Smit", email = "floris.smit@sy-zero.com" }
]
requires-python = ">= 3.13.1,<4.0"
packages = [{ include = "zero_termodinamica"}]
dependencies = [
    "aiomqtt (>=2.4.0,<3.0.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "pymodbustcp (>=0.3.0,<0.4.0)",
    "tenacity (>=9.1.2,<10.0.0)"
]
dynamic = ["version"]

[tool.poetry]
version = "0.0.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
ruff = "^0.12.7"
pyright = "^1.1.403"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest-asyncio = "^1.1.0"
pytest = "^8.4.1"

[tool.ruff]
fix = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]
log_level = "DEBUG"
log_format = "%(asctime)s.%(msecs)03d | %(levelname)-8s | %(message)s"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = ["plugin"] }

[tool.poetry-dynamic-versioning]
enable = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"
