[project]
name = "zero-termodinamica"
description = ""
authors = [{ name = "Floris Smit", email = "floris.smit@sy-zero.com" }]
requires-python = ">= 3.13.1,<4.0"
readme = "README.md"
dependencies = [
    "zero-modbus-bridge",
    "aiomqtt>=2.4.0,<3.0.0",
    "pydantic>=2.11.7,<3.0.0",
    "pydantic-settings>=2.10.1,<3.0.0",
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "ruff>=0.12.7,<0.13",
    "pyright>=1.1.403,<2",
    "fastexcel>=0.20.2,<0.21",
    "polars>=1.42.0,<2",
    "pymodbus-repl",
    "pymodbus>=3.13.1,<4",
]
test = ["pytest-asyncio>=1.1.0,<2", "pytest>=8.4.1,<9"]

[tool.uv]
default-groups = ["dev", "test"]

[tool.uv.sources]
zero-modbus-bridge = { path = "../zero-modbus-bridge", editable = true }
pymodbus-repl = { git = "https://github.com/pymodbus-dev/repl" }

[tool.ruff]
fix = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]
log_level = "DEBUG"
log_format = "%(asctime)s.%(msecs)03d | %(levelname)-8s | %(message)s"

[build-system]
requires = ["hatchling>=1.26,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
search_parent_directories = true
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/zero_termodinamica"]
