[project]
name = "thrs"
description = ""
authors = [
  { name = "Alje van Dam", email = "alje.vandam@foundationzero.org" },
  { name = "Boudewijn van Groos", email = "boudewijn.vangroos@foundationzero.org" },
]
requires-python = ">=3.15.1,<3.16"
readme = "README.md"
license = "MIT"
dependencies = [
  "aiomqtt>=2.3.0,<3.0.0",
  "fmpy>=0.3.22,<0.4.0",
  "jupyter>=1.1.1,<2.0.0",
  "matplotlib>=3.10.0,<4.0.0",
  "pandas>=3.0.6,<4.0.0",
  "plotly>=5.24.1,<6.0.0",
  "polars>=2.0.0,<3.0.0",
  "pyarrow>=26.0.0,<27.0.0",
  "pydantic>=2.11.9,<3.0.0",
  "pydantic-partial>=0.8.0,<1.0.0",
  "pydantic-settings>=2.8.1,<3.0.0",
  "pytransitions>=0.9.2,<1.0.0",
  "simple-pid>=2.0.1,<3.0.0",
  "sqlmodel>=0.0.24,<0.1.0",
  "asyncpg>=0.30.0,<1.0.0",
  "strawberry-graphql[debug-server,asgi,fastapi,cli]",
  "fastapi[standard]>=0.162.0,<0.163.0",
  "uvicorn>=0.54.0,<0.55.0",
  "asyncapi3==0.0.2",
  "more_itertools==11.2.1",
]
dynamic = ["version"]
license-files = ["LICENSE"]

[dependency-groups]
dev = [
  "ruff==0.17.2",
  "pygraphviz==2.0.4",
  "ipympl>=0.9.7,<0.10",
  "pyqtgraph>=0.13.7,<1.0.0",
  "pyside6>=6.8.1.1,<7.0.0",
  "seaborn>=0.13.2,<1.0.0",
]
test = [
  "pyright>=1.1.392.post0,<2",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4,<1.5",
  "pytest-timeout>=2.4.0,<3",
  "pytest-xdist>=3.6.1,<4.0.0",
  "httpx>=0.28.1,<0.29",
  "pytest-cov>=7.1.0,<8",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]
log_level = "DEBUG"
log_format = "%(asctime)s.%(msecs)03d | %(levelname)-8s | %(message)s"
markers = [
  "io: tests that check code against IOlist outside this repo",
  "mqtt: tests requiring a running MQTT broker",
  "slow: Slow tests",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    'if __name__ == "__main__":',
    "@overload",
    "raise NotImplementedError",
    '^\s*\.\.\.$',
]

[tool.ruff]
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "E501",     # Formatter is in charge of line length
  "FIX002",   # Allow for TODO's in the code
  "COM812",   # Skip missing trailing commas, this prevents the formatter from collapsing long lines when it becomes possible 
  "ERA001",   # Allow commented out code for now  
  "ASYNC109", # TODO: determine if we want this
  "PLR2004",  # TODO: Fix me
  "LOG015",   # TODO: Fix me
  "PLR09",    # Ignore too-many rules, they need more attention
  "TRY00",    # TODO: Fix me
  "D",        # Ignore docstring rules for now
  "ANN",      # Ignore annotations rules for now
  "TC",       # Ignore type check rules for now
  "TD",       # Ignore type definition rules for now
  "FBT",      # Ignore boolean trap rules for now
  "PT",       # Ignore pytest rules for now
  "C90",      # Ignore mccabe rules for now
  "EM",       # Ignore error message rules for now
  "ARG",      # Ignore unused arguments rules for now
  "DTZ",      # Ignore datetime timezone rules for now
  "CPY",      # Ignore copyright rules for now
  "PGH003",   # TODO: Fix me
  "B017",     # TODO: Fix me
  "SLF001",   # TODO: Fix me
]
extend-unsafe-fixes = ["COM812"]

[tool.ruff.lint.per-file-ignores]

"tests/**" = [
  "S101",   # We do want asserts in tests 
  "SLF001", # Allow private member access in tests
]

"**/*.ipynb" = [
  "ERA001", # Allow commented out code in notebooks
]

[build-system]
requires = ["hatchling>=1.26,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
search_parent_directories = true
fallback_version = "0.0.0"

[tool.uv]
default-groups = ["dev", "test"]

[tool.uv.sources]
strawberry-graphql = { git = "https://github.com/foundation-zero/strawberry.git", rev = "feature/allow-pydantic-generics" }

[tool.hatch.build.targets.wheel]
packages = ["src/thrs"]
