[project]
name = "thrs"
description = ""
authors = [
    { name = "Alje van Dam", email = "alje.vandam@foundationzero.org" },
    { name = "Boudewijn van Groos", email = "boudewijn.vangroos@foundationzero.org" },
]
requires-python = ">= 3.12.1,<3.14"
readme = "README.md"
license = "MIT"
dependencies = [
    "aiomqtt (>=2.3.0,<3.0.0)",
    "fmpy (>=0.3.22,<0.4.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "matplotlib (>=3.10.0,<4.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "plotly (>=5.24.1,<6.0.0)",
    "polars (>=1.24.0,<2.0.0)",
    "pyarrow (>=19.0.1,<20.0.0)",
    "pydantic (>=2.11.9,<3.0.0)",
    "pydantic-partial (>=0.8.0,<1.0.0)",
    "pydantic-settings (>=2.8.1,<3.0.0)",
    "pytransitions (>=0.9.2,<1.0.0)",
    "simple-pid (>=2.0.1,<3.0.0)",
    "sqlmodel (>=0.0.24,<0.1.0)",
    "asyncpg (>=0.30.0,<1.0.0)",
    "strawberry-graphql[debug-server,asgi,fastapi]",
    "fastapi[standard] (>=0.117.1,<0.118.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
]
dynamic = ["version"]
license-files = ["LICENSE"]

[dependency-groups]
dev = [
    "ruff>=0.11.0,<0.12",
    "pygraphviz==2.0.1",
    "ipympl>=0.9.7,<0.10",
    "pyqtgraph>=0.13.7,<1.0.0",
    "pyside6>=6.8.1.1,<7.0.0",
    "seaborn>=0.13.2,<1.0.0",
]
test = [
    "pyright>=1.1.392.post0,<2",
    "pytest>=8.3.4,<9",
    "pytest-asyncio>=0.25.3,<0.26",
    "pytest-timeout>=2.4.0,<3",
    "pytest-xdist>=3.6.1,<4.0.0",
    "httpx>=0.28.1,<0.29",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]
log_level = "DEBUG"
log_format = "%(asctime)s.%(msecs)03d | %(levelname)-8s | %(message)s"
markers = [
  "io: tests that check code against IOlist outside this repo",
  "mqtt: tests requiring a running MQTT broker",
  "slow: Slow tests",
]

[tool.ruff]
fix = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "RUF"]

[build-system]
requires = ["hatchling>=1.26,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
search_parent_directories = true
fallback_version = "0.0.0"

[tool.uv]
default-groups = ["dev", "test"]

[tool.uv.sources]
strawberry-graphql = { git = "https://github.com/foundation-zero/strawberry.git", rev = "feature/improved-pydantics" }

[tool.hatch.build.targets.wheel]
packages = ["src/thrs"]
