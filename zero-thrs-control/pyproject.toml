[project]
name = "thrs"
description = ""
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Alje van Dam", email = "alje.vandam@foundationzero.org" },
  { name = "Boudewijn van Groos", email = "boudewijn.vangroos@foundationzero.org" }
]
requires-python = ">= 3.12.1,<3.14"
packages = [
  { include = "thrs", from = "src" },
]
dependencies = [
    "aiomqtt (>=2.3.0,<3.0.0)",
    "fmpy (>=0.3.22,<0.4.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "matplotlib (>=3.10.0,<4.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "plotly (>=5.24.1,<6.0.0)",
    "polars (>=1.24.0,<2.0.0)",
    "pyarrow (>=19.0.1,<20.0.0)",
    "pydantic (>=2.11.9,<3.0.0)",
    "pydantic-partial (>=0.8.0,<1.0.0)",
    "pydantic-settings (>=2.8.1,<3.0.0)",
    "pytransitions (>=0.9.2,<1.0.0)",
    "simple-pid (>=2.0.1,<3.0.0)",
    "strawberry-graphql[debug-server,asgi,fastapi] @ git+https://github.com/foundation-zero/strawberry.git@feature/improved-pydantics",
    "fastapi[standard] (>=0.117.1,<0.118.0)",
    "uvicorn (>=0.40.0,<0.41.0)"
]
dynamic = ["version"]

[tool.poetry]
version = "0.0.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.0"
pygraphviz = "^1.14"
ipympl = "^0.9.7"
pyqtgraph  = ">=0.13.7,<1.0.0"
pyside6 = ">=6.8.1.1,<7.0.0"
seaborn = ">=0.13.2,<1.0.0"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pyright = "^1.1.392.post0"
pytest = "^8.3.4"
pytest-asyncio = "^0.25.3"
pytest-timeout = "^2.4.0"
pytest-xdist = ">=3.6.1,<4.0.0"
httpx = "^0.28.1"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]
log_level = "DEBUG"
log_format = "%(asctime)s.%(msecs)03d | %(levelname)-8s | %(message)s"

[tool.ruff]
fix = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = ["plugin"] }

[tool.poetry-dynamic-versioning]
enable = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"
