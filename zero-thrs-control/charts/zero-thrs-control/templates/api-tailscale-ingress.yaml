{{- if and .Values.api.enabled .Values.api.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "zero-thrs-control.control" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zero-thrs-control.labels" . | nindent 4 }}
spec:
  defaultBackend:
    service:
      name: {{ include "zero-thrs-control.control" . }}
      port:
        name: http
  ingressClassName: {{ .Values.api.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.api.ingress.hostname }}
{{- end }}
