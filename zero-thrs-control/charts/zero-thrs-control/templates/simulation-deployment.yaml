{{- if .Values.simulation.enabled }}
{{- $root := . }}
{{- range $index, $type_name := $root.Values.simulation.types }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ print (include "zero-thrs-control.simulation" $root) "-" $type_name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "zero-thrs-control.labels" $root | nindent 4 }}
    app.kubernetes.io/part-of: thrs-control
    app.kubernetes.io/component: {{ print "simulation-" $type_name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "zero-thrs-control.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/part-of: thrs-control
      app.kubernetes.io/component: {{ print "simulation-" $type_name }}
  template:
    metadata:
      labels:
        {{- include "zero-thrs-control.labels" $root | nindent 8 }}
        app.kubernetes.io/part-of: thrs-control
        app.kubernetes.io/component: {{ print "simulation-" $type_name }}
    spec:
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: thrs-control
          args: ["{{ $type_name }}"] 
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          image: "{{ $root.Values.simulation.image.repository }}:{{ $root.Values.simulation.image.tag | default $root.Chart.AppVersion }}"
          imagePullPolicy: {{ $root.Values.simulation.image.pullPolicy }}
          resources:
            {{- toYaml $root.Values.simulation.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "zero-thrs-control.envvars" $root }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp-volume
      volumes:
        - name: tmp-volume
          emptyDir: {}
{{- end }}
{{- end }}