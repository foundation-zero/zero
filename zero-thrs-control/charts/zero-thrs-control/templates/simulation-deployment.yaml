{{- if .Values.simulation.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ print (include "zero-thrs-control.simulation" .) "-" $type_name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zero-thrs-control.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: thrs-control
    app.kubernetes.io/component: {{ print "control-" $type_name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "zero-thrs-control.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/part-of: thrs-control
      app.kubernetes.io/component: {{ print "control-" $type_name }}
  template:
    metadata:
      labels:
        {{- include "zero-thrs-control.labels" . | nindent 8 }}
        app.kubernetes.io/part-of: thrs-control
        app.kubernetes.io/component: {{ print "control-" $type_name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: thrs-control
          args:
           - "simulation"
           - "--mode"
           - "{{ $type_name }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.simulation.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "zero-thrs-control.envvars" . }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp-volume
      volumes:
        - name: tmp-volume
          emptyDir: {}
{{- end }}
