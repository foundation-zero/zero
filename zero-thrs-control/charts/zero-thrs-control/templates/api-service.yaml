{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "zero-thrs-control.api" . }}
  labels:
    {{- include "zero-thrs-control.labels" . | nindent 4 }}
    {{- with .Values.api.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  {{- with .Values.api.service.externalIP }}
  externalIPs:
    - {{ . | quote }}
  {{- end }}
  ports:
    - port: 5102
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "zero-thrs-control.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- end }}
