{{- if .Values.control.enabled }}
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "zero-thrs-control.control" . }}
  labels:
    {{- include "zero-thrs-control.labels" . | nindent 4 }}
spec:
  type: LoadBalancer
  externalIPs: {{ .Values.control.service.externalIPs }}
  ports:
    - port: {{ .Values.control.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "zero-thrs-control.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/part-of: thrs-control
    app.kubernetes.io/component: control
  type: ClusterIP
{{- end }}
