{{- if .Values.control.enabled }}
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "zero-thrs-control.control" . }}
  labels:
    {{- include "..labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: 5102
      targetPort: http
      protocol: TCP
  selector:
    {{- include "zero-thrs-control.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: control
  type: ClusterIP
{{- end }}
