{{- if or .Values.control.enabled .Values.simulation.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "zero-thrs-control.name" . }}-image-prepull
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zero-thrs-control.labels" . | nindent 4 }}
    app.kubernetes.io/component: image-prepull
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "zero-thrs-control.labels" . | nindent 8 }}
        app.kubernetes.io/component: image-prepull
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: image-prepull
          image: "{{ .Values.control.image.repository }}:{{ .Values.control.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.control.image.pullPolicy }}
          command: ["true"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
{{- end }}
