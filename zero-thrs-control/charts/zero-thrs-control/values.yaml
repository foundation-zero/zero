# Required: MQTT host
mqtt:
  host:
  port: 1883
  username: thrs
  existingSecret:
  existingSecretPasswordKey: password

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
control:
  enabled: true
  image:
    repository: europe-west1-docker.pkg.dev/common-449414/common/zero-thrs-control
    # This sets the pull policy for images.
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  resources: {}
  service:
    labels: {}
    annotations: {}
  ingress:
    enabled: false
    hostname: ""
    className: tailscale

simulation:
  enabled: false # To be enabled on i.e. 'Singel' environment
  image:
    repository: europe-west1-docker.pkg.dev/common-449414/common/zero-thrs-simulation
    # This sets the pull policy for images.
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  resources: {}
  types: ["thrusters", "pvt", "pcm", "consumers", "high_temperature", "dhw"]

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""
