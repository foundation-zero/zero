table:
  name: rooms_controls_log
  schema: public
object_relationships:
  - name: control
    using:
      foreign_key_constraint_on: id
  - name: room
    using:
      foreign_key_constraint_on: room_id
select_permissions:
  - role: user
    permission:
      columns: "*"
      filter:
        room_id: { _eq: X-Hasura-Cabin }
      allow_aggregations: false
    comment: ""
