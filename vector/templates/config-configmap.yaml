{{- range $pipeline := list "atpx" "ingest" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config-{{ $pipeline }}
  namespace: {{ $.Release.Namespace }}
data:
  config.yaml: |-
{{ $.Files.Get (printf "config-%s.yaml" $pipeline) | indent 4 }}
{{- end }}
---
# Legacy single-instance config, mounted by the `vector` HelmRelease until all
# clusters run vector-atpx and vector-ingest (ZERO-2397). Remove it afterwards.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |-
{{ .Files.Get "config.yaml" | indent 4 }}
