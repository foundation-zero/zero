data_dir: /vector-data
api:
  enabled: true
  address: 127.0.0.1:8686
  playground: false
sources:
  mqtt:
    type: mqtt
    host: "${MQTT_HOST}:${MQTT_PORT}"
    decoding:
      codec: json
    topic: "marpower/#"
    user: "${MQTT_USER}"
    password: "${MQTT_PASSWORD}"
transforms:
  process:
    type: remap
    inputs: ["mqtt"]
    files:
      - "/etc/vector/0_consts.vrl"
      - "/etc/vector/1_table.vrl"
      - "/etc/vector/2_flatten.vrl"
      - "/etc/vector/3_timestamp.vrl"
      - "/etc/vector/4_spell_fix.vrl"
      - "/etc/vector/5_snakecase.vrl"

sinks:
  greptimedb:
    type: greptimedb_logs
    inputs: ["process"]
    endpoint: "http://${GREPTIMEDB_HOST}:${GREPTIMEDB_PORT}"
    dbname: "public"
    table: "{{ table }}"
    extra_params:
      custom_time_index: "timestamp;datestr;%+"
