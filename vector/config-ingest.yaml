data_dir: /vector-data
api:
  enabled: true
  address: 127.0.0.1:8686
sources:
  mqtt:
    type: mqtt
    host: "${MQTT_HOST}"
    port: ${MQTT_PORT}
    client_id: vector
    decoding:
      codec: bytes
    topic:
      - "marpower/#"
      - "domestic/+"
      - "hull-temperature/temperatures"
      - "termodinamica/#"
      - "sail-systems/#"
      - "power-tags/#"
      - "fiber-optics/values"
      - "thrs/controller/#"
    user: "${MQTT_USER}"
    password: "${MQTT_PASSWORD}"
    max_packet_size: 163840
  # A+T (ATPX) NMEA 0183 stream, already parsed to JSON and republished on our
  # own broker by the standalone zero-atpx-nmea service. See ZERO-1660.
  atpx_nmea_mqtt:
    type: mqtt
    host: "${MQTT_HOST}"
    port: ${MQTT_PORT}
    client_id: vector-atpx-nmea
    topic:
      - "atpx/processed/nmea/#"
    decoding:
      codec: json
    user: "${MQTT_USER}"
    password: "${MQTT_PASSWORD}"
  vector_metrics:
    type: internal_metrics
transforms:
  filter_ignored:
    type: remap
    inputs: ["mqtt"]
    files:
      - "/etc/vector/filter_ignored.vrl"
    drop_on_abort: true
  process:
    type: remap
    inputs: ["filter_ignored"]
    files:
      - "/etc/vector/process_0_consts.vrl"
      - "/etc/vector/process_1_ingest.vrl"
      - "/etc/vector/process_2_table.vrl"
      - "/etc/vector/process_3_flatten.vrl"
      - "/etc/vector/process_4_timestamp.vrl"
      - "/etc/vector/process_5_spell_fix.vrl"
      - "/etc/vector/process_6_snakecase.vrl"
      - "/etc/vector/process_7_drop_nans.vrl"
    # Enable dead letter queue
    drop_on_error: true
    drop_on_abort: true
    reroute_dropped: true
  # Derives the Greptime table name from the parser's `type` field and stamps
  # ingestion time as the uniform time index. Each NMEA sentence is an
  # independent row - no reduce/merge step (ATPX lands raw, see atpx_parse).
  atpx_nmea_route:
    type: remap
    inputs: ["atpx_nmea_mqtt"]
    files:
      - "/etc/vector/atpx_nmea_route.vrl"
    # Enable dead letter queue
    drop_on_error: true
    drop_on_abort: true
    reroute_dropped: true
  dropped_append_timestamp:
    type: remap
    inputs: ["*.dropped"]
    source: |
      if !exists(.timestamp) || is_null(.timestamp) {
        .timestamp = now()
      }
sinks:
  greptimedb:
    type: greptimedb_logs
    inputs: ["process", "atpx_nmea_route"]
    endpoint: "http://${GREPTIMEDB_HOST}:${GREPTIMEDB_PORT}"
    dbname: "public"
    table: "{{ %table }}"
    extra_params:
      custom_time_index: "timestamp;datestr;%+"
    # Rides out a Greptime outage of ~30 min (~1.3 MB/s). When full it blocks:
    # the mqtt sources then stop reading, so the backlog waits in RabbitMQ's
    # durable subscription queues instead of being dropped.
    buffer:
      type: disk
      max_size: 4294967296
      when_full: block
  prometheus:
    type: prometheus_exporter
    inputs:
      - vector_metrics
    address: 0.0.0.0:9090 # prom-exporter port from chart
  dead_letter_queue:
    type: greptimedb_logs
    inputs: ["dropped_append_timestamp"]
    endpoint: "http://${GREPTIMEDB_HOST}:${GREPTIMEDB_PORT}"
    dbname: "public"
    table: "vector_dead_letter_queue"
    extra_params:
      custom_time_index: "timestamp;datestr;%+"
