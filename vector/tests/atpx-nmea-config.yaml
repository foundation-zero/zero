sources:
  input:
    type: exec
    command:
      - "cat"
      - "tests/atpx-nmea-test-cases.json"
    mode: streaming
    decoding:
      codec: json
    streaming:
      respawn_on_exit: false

transforms:
  take_msg:
    type: remap
    inputs: ["input"]
    source: |
      del(.command)
      del(.host)
      del(.pid)
      del(.source_type)
      del(.stream)
  atpx_nmea_route:
    type: remap
    inputs: ["take_msg"]
    files:
      - "./processing/atpx_nmea_route.vrl"
  # .timestamp is set to now() in atpx_nmea_route.vrl, so it's non-deterministic;
  # strip it here so the test can do an exact diff against expected output.
  strip_timestamp:
    type: remap
    inputs: ["atpx_nmea_route"]
    source: |
      del(.timestamp)

sinks:
  output:
    type: console
    inputs: ["strip_timestamp"]
    encoding:
      codec: json
