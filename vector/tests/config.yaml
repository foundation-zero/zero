sources:
  input:
    type: exec
    command:
      - "cat"
      - "tests/process-test-cases.json"
    mode: streaming
    decoding:
      codec: json
    streaming:
      respawn_on_exit: false
transforms:
  take_msg:
    type: remap
    inputs: ["input"]
    source: |
      del(.command)
      del(.host)
      del(.pid)
      del(.source_type)
      del(.stream)
  process:
    type: remap
    inputs: ["take_msg"]
    files:
      - "./processing/process_0_consts.vrl"
      - "./processing/process_1_ingest.vrl"
      - "./processing/process_2_table.vrl"
      - "./processing/process_3_flatten.vrl"
      - "./processing/process_4_timestamp.vrl"
      - "./processing/process_5_spell_fix.vrl"
      - "./processing/process_6_snakecase.vrl"
    drop_on_error: true
  re_add_table:
    type: remap
    inputs: ["process"]
    source: |
      .table = %table
sinks:
  output:
    type: console
    inputs: ["re_add_table"]
    encoding:
      codec: json
