sources:
  input:
    type: exec
    command:
      - "cat"
      - "tests/process-test-cases.jsonl"
    mode: streaming
    decoding:
      codec: json
    streaming:
      respawn_on_exit: false
transforms:
  take_msg:
    type: remap
    inputs: ["input"]
    source: |
      del(.command)
      del(.host)
      del(.pid)
      del(.source_type)
      del(.stream)
  filter_ignored:
    type: remap
    inputs: ["take_msg"]
    files:
      - "./processing/filter_ignored.vrl"
    drop_on_abort: true
  process:
    type: remap
    inputs: ["filter_ignored"]
    files:
      - "./processing/process_0_consts.vrl"
      - "./processing/process_1_ingest.vrl"
      - "./processing/process_2_table.vrl"
      - "./processing/process_3_flatten.vrl"
      - "./processing/process_4_timestamp.vrl"
      - "./processing/process_5_spell_fix.vrl"
      - "./processing/process_6_snakecase.vrl"
      - "./processing/process_7_drop_nans.vrl"
    drop_on_error: true
    reroute_dropped: true
  dropped_append_timestamp:
    type: remap
    inputs: ["*.dropped"]
    files:
      - "./processing/dropped_append_timestamp.vrl"
  # Tags rerouted events, so an event that should have been dropped but wasn't
  # cannot match a dead letter line in the expected output.
  mark_dead_letter:
    type: remap
    inputs: ["dropped_append_timestamp"]
    source: |
      del(.metadata)
      .dead_letter = true
      if is_timestamp(.timestamp) {
        .timestamp = "<ingest-time>"
      }
  re_add_table:
    type: remap
    inputs: ["process"]
    source: |
      .table = %table
sinks:
  output:
    type: console
    inputs: ["re_add_table"]
    encoding:
      codec: json
  dead_letter_queue:
    type: console
    inputs: ["mark_dead_letter"]
    encoding:
      codec: json
