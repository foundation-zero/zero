[project]
name = "loads"
version = "0.1.2"
description = ""
readme = "README.md"
authors = [
    { name = "Boudewijn van Groos", email = "boudewijn.vangroos@foundationzero.org>" },
    { name = "Dustin van Weersel", email = "dustin.vanweersel@foundationzero.org>" }
]
packages = [
    { include = "loads", from = "src" },
]
requires-python = ">= 3.13.1,<4.0"

[tool.poetry.dependencies]
aiomqtt = ">=2.4.0,<3.0.0"
construct = ">=2.10.70,<3.0.0"
dbt-core = ">=1.9.8,<2.0.0"
dbt-risingwave = ">=1.9.2,<2.0.0"
fastapi = { version = ">=0.115.6,<0.116.0", extras = ["standard"] }
homeassistant-api = ">=5.0.0,<6.0.0"
psycopg = { version = ">=3.2.3,<4.0.0", extras = ["binary", "async"] }
pydantic-settings = ">=2.7.1,<3.0.0"
strawberry-graphql = { version = ">=0.256.1,<0.257.0", extras = ["debug-server", "fastapi"] }
pyjwt = ">=2.10.1"
asyncpg = ">=0.30.0,<0.31.0"
sqlalchemy = ">=2.0.43,<3.0.0"
greenlet = ">=3.2.4,<4.0.0"
uvicorn = ">=0.35.0,<0.36.0"
asgi-lifespan = ">=2.1.0,<3.0.0"
generator = { path = "../zero-generator", develop=true}

[project.scripts]
loads = "loads.__main__:run"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
mypy = "^1.14.1"
ruff = "^0.9.5"
python-dotenv = "^1.1.0"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^0.25.1"
pytest-env = "^1.1.5"
httpx = "^0.28.1"
pytest-timeout = "^2.3.1"
pytest-mock = "^3.14.0"

[tool.mypy]
plugins = "pydantic.mypy,strawberry.ext.mypy_plugin"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]
log_level = "DEBUG"
log_format = "%(asctime)s.%(msecs)03d | %(levelname)-8s | %(message)s"

[tool.ruff]
fix = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
