[project]
name = "zero-atpx-nmea"
description = "A+T (ATPX) NMEA 0183 → JSON MQTT bridge"
readme = "README.md"
authors = [
    { name = "Floris Smit", email = "florissmit10@gmail.com" }
]
requires-python = ">= 3.13.1,<4.0"
dependencies = [
    "pydantic>=2.11.7,<3.0.0",
    "pydantic-settings>=2.10.1,<3.0.0",
    "faststream[mqtt]>=0.7.0,<1.0.0",
    "pynmea2>=1.19.0,<2.0.0",
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "ruff>=0.12.7,<0.13",
    "pyright>=1.1.403,<2",
]
test = ["pytest-asyncio>=1.1.0,<2", "pytest>=8.4.1,<9"]

[tool.uv]
default-groups = ["dev", "test"]

[tool.ruff]
fix = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.26,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
search_parent_directories = true
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/zero_atpx_nmea"]
