[package]
name = "zero-battery-cells"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
config = "0.14"
dotenvy = "0.15"
env_logger = "0.10"
futures-util = "0.3"
log = "0.4"
nom = "7.1"
rumqttc = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
tokio-stream = "0.1"
