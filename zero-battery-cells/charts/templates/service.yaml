apiVersion: v1
kind: Service
metadata:
  name: {{ include "zero-battery-cells.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zero-battery-cells.labels" . | nindent 4 }}
    {{- with .Values.udp.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.udp.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ if .Values.udp.externalIPs }}LoadBalancer{{ else }}ClusterIP{{ end }}
  {{- with .Values.udp.externalIPs }}
  externalIPs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "zero-battery-cells.selectorLabels" . | nindent 4 }}
  ports:
    - name: udp-{{ .Values.udp.port }}
      port: {{ .Values.udp.port }}
      targetPort: {{ .Values.udp.port }}
      protocol: UDP
