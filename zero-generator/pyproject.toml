[project]
name = "generator"
dynamic = ["version"]
description = ""
authors = [
    { name = "Dustin van Weersel", email = "dustin.vanweersel@foundationzero.org" },
]
requires-python = ">=3.15.1,<4.0"
readme = "README.md"
dependencies = ["aiomqtt>=2.4.0,<3.0.0", "pydantic-settings>=2.11.0,<3.0.0"]

[dependency-groups]
dev = ["mypy>=2.4.0,<2.5.0", "ruff>=0.9.5,<1.0.0"]
test = [
    "pytest>=9.2.0,<9.3.0",
    "pytest-asyncio>=1.4.0,<1.5.0",
    "pytest-cov>=7.1.0,<8",
    "pytest-mock>=3.14.0,<4.0.0",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]
log_level = "DEBUG"
log_format = "%(asctime)s.%(msecs)03d | %(levelname)-8s | %(message)s"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    'if __name__ == "__main__":',
    "@overload",
    "raise NotImplementedError",
    '^\s*\.\.\.$',
]

[tool.ruff]
fix = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["hatchling>=1.26,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
search_parent_directories = true
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/generator"]
