{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "zero-mqtt-graphql.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zero-mqtt-graphql.labels" . | nindent 4 }}
spec:
  defaultBackend:
    service:
      name: {{ include "zero-mqtt-graphql.fullname" . }}
      port:
        name: http
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.hostname }}
{{- end }}
