replicaCount: 1

image:
  repository: europe-west1-docker.pkg.dev/common-449414/common/zero-mqtt-graphql
  pullPolicy: IfNotPresent
  tag: ""

specDir: /app/specs
logLevel: info
listenPort: 5103
defaultTtlSecs: 300
# Command to run: "serve" (default), "validate" or "listen"
command: serve

strictValidation: false  # drop schema-invalid payloads
enableOptionalSensorValues: false  # sensor fields nullable, per field
enableMutations: false  # serve mutations and directives

mqtt:
  host: ""
  port: 1883
  username: ""
  existingSecret: ""
  existingSecretPasswordKey: password
  devicesTopicPrefix: ""
  controllerTopicPrefix: ""
  simulatorTopicPrefix: ""
  controlTopicSuffix: ""
  controllerTopicSuffix: ""
  simulatorTopicSuffix: ""

resources: {}

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

nodeSelector: {}

tolerations: []

affinity: {}
