[package]
name = "zero-mqtt-graphql"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.43", features = ["full", "sync"] }
axum = "0.8"
async-graphql = { version = "7.2", features = ["dynamic-schema"] }
rumqttc = "0.24"
dashmap = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.6", features = ["cors"] }
clap = { version = "4.5", features = ["derive"] }
config = "0.14"
dotenvy = "0.15"
anyhow = "1.0"
env_logger = "0.10"
log = "0.4"
roas-asyncapi = { version = "0.4.0", features = ["v3_0"] }
jsonschema = { version = "0.26", default-features = false }

[lints.rust]
warnings = "deny"

[lints.clippy]
result_large_err = "deny"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
