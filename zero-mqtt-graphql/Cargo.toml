[package]
name = "zero-mqtt-graphql"
version = "0.1.0"
edition = "2024"

[dependencies]
jsonschema = { version = "0.60.2", default-features = false }
tokio = { version = "1.54.1", features = ["full", "sync"] }
axum = "0.8"
async-graphql = { version = "8.0.0-rc.5", features = ["dynamic-schema"] }
rumqttc = "0.25.1"
dashmap = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
tower-http = { version = "0.7.1", features = ["cors"] }
clap = { version = "4.6.7", features = ["derive"] }
config = "0.15.27"
dotenvy = "0.15"
anyhow = "1.0"
env_logger = "0.11.11"
log = "0.4.34"
roas-asyncapi = { version = "0.4.0", features = ["v3_0"] }
convert_case = "0.12.0"

[lints.rust]
warnings = "deny"

[lints.clippy]
result_large_err = "deny"
dbg_macro = "warn"
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
test-log = "=0.2.21"
