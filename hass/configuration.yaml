# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

light:
  - platform: b2p
    name: "Owner's cabin - Ambient"
    host: host.docker.internal
    pdc: 1
    channel: 1
  - platform: b2p
    name: "Owner's cabin - Mood"
    host: host.docker.internal
    pdc: 1
    channel: 2

mqtt:
  binary_sensor:
    - name: "Night Mode (interior)"
      state_topic: "marpower/550000-navigation-lights"
      qos: 0
      value_template: "{{ value_json.InternalNightMode.Value | string | lower }}"
      payload_on: "true"
      payload_off: "false"
    - name: "Night Mode (exterior)"
      state_topic: "marpower/550000-navigation-lights"
      qos: 0
      value_template: "{{ value_json.ExternalNightMode.Value | string | lower }}"
      payload_on: "true"
      payload_off: "false"

template:
  - cover:
      - name: "Owner's cabin main shear"
        unique_id: template_owners_cabin_main_shear
        default_entity_id: cover.owners_cabin_main_shear
        position: "{{ states.input_number.owners_cabin_main_shear.state | float }}"
        set_cover_position:
          action: input_number.set_value
          target:
            entity_id: input_number.owners_cabin_main_shear
          data:
            value: "{{ position }}"
      - name: "Owner's cabin main blind"
