set_input_helper:
  sequence:
    - variables:
        input_number_id:
        value:
    - action: input_number.set_value
      metadata: {}
      target:
        entity_id: "{{ input_number_id }}"
      data:
        value: "{{ value }}"
  alias: Set input helper
  description: ""

