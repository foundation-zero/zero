blueprint:
  name: "Lights: Turn off"
  description: "Turn off a light"
  domain: script

fields:
  dim_level:
    description: "Target dim level entity"

sequence:
  - alias: Turn off light
    service: input_number.set_value
    target:
      entity_id: "{{ dim_level }}"
    data:
      value: "{{ states(dim_level) | int | abs * -1 }}"
