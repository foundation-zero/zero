name: "Registry Cache"
description: >
  Gives the cache-from/cache-to values for docker/build-push-action that keep an image's BuildKit
  cache in the `buildcache` Artifact Registry repository (set up in
  https://github.com/foundation-zero/gcp-common). Every build reads the cache main wrote; only main
  writes it, so PRs can't overwrite each other's cache. Needs a docker login to the registry.
inputs:
  image:
    description: "Image the build pushes; its last path segment names the cache"
    required: true
  cache-repository:
    description: "Registry repository that holds the caches"
    required: false
    default: "europe-west1-docker.pkg.dev/common-449414/buildcache"
outputs:
  cache-from:
    description: "Value for build-push-action's cache-from"
    value: ${{ steps.cache.outputs.cache-from }}
  cache-to:
    description: "Value for build-push-action's cache-to; empty outside main"
    value: ${{ steps.cache.outputs.cache-to }}
runs:
  using: "composite"
  steps:
    - name: Resolve cache refs
      id: cache
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        CACHE_REPOSITORY: ${{ inputs.cache-repository }}
      run: |
        ref="$CACHE_REPOSITORY/${IMAGE##*/}:main"
        echo "cache-from=type=registry,ref=$ref" >> "$GITHUB_OUTPUT"
        if [ "$GITHUB_REF" == "refs/heads/main" ]; then
          # A failed cache write shouldn't fail the build.
          echo "cache-to=type=registry,ref=$ref,mode=max,ignore-error=true" >> "$GITHUB_OUTPUT"
        fi
