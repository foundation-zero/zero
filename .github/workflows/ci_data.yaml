name: "Data: Test"
on:
  pull_request:
    paths:
      - .github/workflows/ci_data.yaml
      - data/**
  release:
    types: [released]
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci_data.yaml
      - data/**

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: "0"
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - run: pipx install poetry==2.2.1
      - run: poetry check
        working-directory: data
