name: "Hasura: Build and push Docker image"
on:
  pull_request:
    paths:
      - .github/workflows/ci_hasura.yaml
      - hasura/**
  release:
    types: [released]
  push:
    branches:
      - main
    paths:
      - hasura/**
      - .github/workflows/ci_hasura.yaml

env:
  IMAGE: "europe-west1-docker.pkg.dev/common-449414/common/hasura-graphql-engine"

jobs:
  docker-push:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@v5
      # Set up in https://github.com/foundation-zero/gcp-common
      - id: auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          project_id: ${{ secrets.GCP_COMMON_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_COMMON_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_COMMON_SERVICE_ACCOUNT }}
          access_token_lifetime: 300s
      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: hasura
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  helm-push:
    if: ${{ github.event_name == 'release' }}
    needs: docker-push
    uses: "./.github/workflows/job_helm_push.yaml"
    permissions:
      contents: "read"
      id-token: "write"
    secrets: inherit
    with:
      helm_chart: "hasura/charts"
      version_updates: '[{"file": "hasura/charts/values.yaml", "path": ".hasura-enterprise-stack.graphql-engine.image.tag"}]'

