name: "Hasura: Build and push Docker image"
on:
  pull_request:
    paths:
      - .github/workflows/ci_hasura.yaml
      - hasura/**
  release:
    types: [released]
  push:
    branches:
      - main
    paths:
      - hasura/**
      - .github/workflows/ci_hasura.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-push:
    uses: "./.github/workflows/job_docker_push.yaml"
    permissions:
      contents: "read"
      id-token: "write"
    secrets: inherit
    with:
      image: "hasura-graphql-engine"
      context: "hasura"
      platforms: "linux/amd64"

  helm-push:
    if: ${{ github.event_name == 'release' ||  github.ref == 'refs/heads/main' }}
    needs: docker-push
    uses: "./.github/workflows/job_helm_push.yaml"
    permissions:
      contents: "read"
      id-token: "write"
    secrets: inherit
    with:
      helm_chart: "hasura/charts"
      version_updates: '[{"file": "hasura/charts/values.yaml", "path": ".hasura-enterprise-stack.graphql-engine.image.tag"}]'
