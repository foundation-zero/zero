name: "Zero UI Apps: Test and push Docker image"
on:
  pull_request:
    paths:
      - .github/workflows/ci_apps.yaml
      - .github/actions/coverage-report/**
      - zero-ui/**
      - zero-loads-app/**
      - zero-thrs-control/**
  release:
    types: [released]
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci_apps.yaml
      - .github/actions/coverage-report/**
      - zero-ui/**
      - zero-loads-app/**
      - zero-thrs-control/**

env:
  IMAGE: "europe-west1-docker.pkg.dev/common-449414/common/zero-ui"
  CACHE: "europe-west1-docker.pkg.dev/common-449414/buildcache/zero-ui:main"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: zero-ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: zero-ui/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: zero-ui
        run: pnpm install

      - name: Run ESLint
        working-directory: zero-ui
        run: pnpm lint --max-warnings 0

      - name: Run unit tests
        working-directory: zero-ui
        run: pnpm test:unit --coverage.reporter=text-summary --coverage.reporter=cobertura

      - name: Create .env file from secret in root for services
        run: |
          echo "${{ secrets.ENV }}" > .env

      - name: Create .env file from secret in Loads project
        run: |
          echo "${{ secrets.ENV_LOADS_APP }}" > .env
        working-directory: zero-loads-app

      - name: Create .env file from secret in THRS project
        run: |
          echo "${{ secrets.ENV_THRS }}" > .env
        working-directory: zero-thrs-control

      - name: Run services
        run: MACHINE_STATE_LOGGING=false docker compose --profile loads --profile thrs up --quiet-pull --wait

      - name: Waiting for services to be ready
        run: sleep 30s
        shell: bash

      - name: Run api integration tests
        working-directory: zero-ui
        run: pnpm test:api --coverage.reporter=text-summary --coverage.reporter=cobertura

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-zero-ui
          path: zero-ui/coverage/*/cobertura-coverage.xml
          retention-days: 90

      - name: Build documentation
        working-directory: zero-ui
        run: pnpm docs:build

      - name: Install Playwright Browsers
        working-directory: zero-ui
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: zero-ui
        run: pnpm exec playwright test
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:5173
          VITE_GRAPHQL_WS_URL: ws://localhost:8080/v1/graphql
          VITE_GRAPHQL_URL: http://localhost:8080/v1/graphql
          VITE_GRAPHQL_TOKEN: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJodHRwczovL2hhc3VyYS5pby9qd3QvY2xhaW1zIjp7IngtaGFzdXJhLWRlZmF1bHQtcm9sZSI6InVzZXIiLCJ4LWhhc3VyYS1hbGxvd2VkLXJvbGVzIjpbInVzZXIiXX19.8brSVzCMabnkuvgO4ipCVAPaAWieM3sqWADXoUxgmEA
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: zero-ui/playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: screenshots
          path: zero-ui/screenshots/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: zero-ui-docs
          path: zero-ui/docs/.vitepress/dist
          retention-days: 7

  coverage:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: "read"
      actions: "read"
      pull-requests: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-zero-ui
          path: ${{ runner.temp }}/coverage
      - uses: ./.github/actions/coverage-report
        with:
          project: zero-ui
          report-dir: ${{ runner.temp }}/coverage
          fail-under: "11"

  docker-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Set up in https://github.com/foundation-zero/gcp-common
      - id: auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          token_format: access_token
          project_id: ${{ secrets.GCP_COMMON_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_COMMON_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_COMMON_SERVICE_ACCOUNT }}
          access_token_lifetime: 300s
      - name: Login to Artifact Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Generate Version
        id: version
        uses: ./.github/actions/generate-version
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: zero-ui
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.CACHE }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref={0},mode=max,ignore-error=true', env.CACHE) || '' }}

  push-cloudflare:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: "read"
      deployments: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: zero-ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: zero-ui/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: zero-ui
        run: pnpm install
      - name: Build
        run: pnpm build
        working-directory: zero-ui
      - name: Add env.json
        working-directory: zero-ui/dist
        run: |
          echo '{
            "VITE_THRS_API_SERVER_URL": "https://thrs-control-singel.tail0b4840.ts.net/graphql",
            "VITE_LOADS_API_SERVER_URL": "https://loads-app-singel.tail0b4840.ts.net/graphql",
            "VITE_GRAPHQL_URL": "https://hasura-singel.tail0b4840.ts.net/v1/graphql",
            "VITE_GRAPHQL_WS_URL": "ws://hasura-singel.tail0b4840.ts.net/v1/graphql",
            "VITE_GRAPHQL_TOKEN": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJodHRwczovL2hhc3VyYS5pby9qd3QvY2xhaW1zIjp7IngtaGFzdXJhLWRlZmF1bHQtcm9sZSI6InVzZXIiLCJ4LWhhc3VyYS1hbGxvd2VkLXJvbGVzIjpbInVzZXIiXX19.8brSVzCMabnkuvgO4ipCVAPaAWieM3sqWADXoUxgmEA",
            "VITE_SHOW_DEMO_MODE": "0"
          }' > env.json
      - name: Deploy preview
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zero-ui
          gitHubToken: ${{ github.token }}
          packageManager: pnpm
          workingDirectory: zero-ui
          wranglerVersion: "4"

  helm-push:
    if: ${{ github.event_name == 'release' ||  github.ref == 'refs/heads/main' }}
    needs: docker-push
    uses: "./.github/workflows/job_helm_push.yaml"
    permissions:
      contents: "read"
      id-token: "write"
    secrets: inherit
    with:
      helm_chart: "zero-ui/charts"
