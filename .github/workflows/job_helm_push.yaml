on:
  workflow_call:
    inputs:
      helm_chart:
        description: "Path to the helm chart directory"
        type: string
        required: true

jobs:
  helm-push:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Update Chart Versions
        id: chart_info
        #if: ${{ github.event_name == 'release' }}
        run: |
          # v1.2.3
          #export GIT_REF=${{github.ref_name}}
          export GIT_REF="v1.2.3"
          # 1.2.3
          export VERSION=${GIT_REF#v}
          yq e -i '.version = strenv(VERSION)' ${{ inputs.helm_chart }}/Chart.yaml
          yq e -i '.appVersion = strenv(VERSION)'  ${{ inputs.helm_chart }}/Chart.yaml
      - id: auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          project_id: ${{ secrets.GCP_COMMON_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_COMMON_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_COMMON_SERVICE_ACCOUNT }}
          access_token_lifetime: 300s
      - name: Login to Artifact Registry
        uses: docker/login-action@v1
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Publish Helm chart
        run: |
          CHART_NAME=$(yq '.name' '${{ inputs.helm_chart }}/Chart.yaml')
          CHART_VERSION=$(yq '.version' '${{ inputs.helm_chart }}/Chart.yaml')
          helm package ${{ inputs.helm_chart }}
          helm push $CHART_NAME-$CHART_VERSION.tgz oci://europe-west1-docker.pkg.dev/common-449414/common
