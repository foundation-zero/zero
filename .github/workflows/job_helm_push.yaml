on:
  workflow_call:
    inputs:
      helm_chart:
        description: "Path to the helm chart directory"
        type: string
        required: true
      version_updates:
        description: "Optional JSON array of objects with file and path keys to update with the release version"
        type: string
        required: false
jobs:
  helm-push:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"
          fetch-tags: true
      - name: Generate Version
        id: version
        uses: ./.github/actions/generate-version
      - name: Update Chart Versions
        id: chart_info
        if: ${{ github.event_name == 'release' ||  github.ref == 'refs/heads/main' }}
        env:
          VERSION_UPDATES: ${{ inputs.version_updates }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          yq e -i '.version = strenv(VERSION)' ${{ inputs.helm_chart }}/Chart.yaml
          yq e -i '.appVersion = strenv(VERSION)'  ${{ inputs.helm_chart }}/Chart.yaml
          if [ -n "$VERSION_UPDATES" ]; then
            printf '%s' "$VERSION_UPDATES" | jq -c '.[]' | while IFS= read -r update; do
              update_file=$(printf '%s' "$update" | jq -r '.file')
              update_path=$(printf '%s' "$update" | jq -r '.path')
              yq e -i "${update_path} = strenv(VERSION)" "$update_file"
            done
          fi
      - id: auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          token_format: access_token
          project_id: ${{ secrets.GCP_COMMON_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_COMMON_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_COMMON_SERVICE_ACCOUNT }}
          access_token_lifetime: 300s
      - name: Login to Artifact Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Set up Helm repositories
        run: |
          helm repo add hasura https://hasura.github.io/helm-charts
          helm repo update
      - name: Publish Helm chart
        run: |
          CHART_NAME=$(yq '.name' '${{ inputs.helm_chart }}/Chart.yaml')
          CHART_VERSION=$(yq '.version' '${{ inputs.helm_chart }}/Chart.yaml')
          helm dependency build ${{ inputs.helm_chart }}
          helm package ${{ inputs.helm_chart }}
          helm push $CHART_NAME-$CHART_VERSION.tgz oci://europe-west1-docker.pkg.dev/common-449414/common
