name: "Power Tags: Test and push Docker image"
on:
  pull_request:
    paths:
      - zero-modbus-bridge/**
      - zero-power-tags/**
      - .github/workflows/ci_power_tags.yaml
      - .github/actions/coverage-report/**
  release:
    types: [released]
  push:
    branches:
      - main
    paths:
      - zero-modbus-bridge/**
      - zero-power-tags/**
      - .github/workflows/ci_power_tags.yaml
      - .github/actions/coverage-report/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: 3.15
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: uv sync --locked
        working-directory: zero-power-tags
      - run: just ci
        working-directory: zero-power-tags
      - run: just test --cov-report=xml
        working-directory: zero-power-tags
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-zero-power-tags
          path: zero-power-tags/coverage.xml
          retention-days: 90

  coverage:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: "read"
      actions: "read"
      pull-requests: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-zero-power-tags
          path: ${{ runner.temp }}/coverage
      - uses: ./.github/actions/coverage-report
        with:
          project: zero-power-tags
          report-dir: ${{ runner.temp }}/coverage

  docker-push:
    uses: "./.github/workflows/job_docker_push.yaml"
    permissions:
      contents: "read"
      id-token: "write"
    secrets: inherit
    with:
      image: "zero-power-tags"
      context: "."
      dockerfile: "zero-power-tags/Dockerfile"
  helm-push:
    if: ${{ github.event_name == 'release' ||  github.ref == 'refs/heads/main' }}
    needs: [test, docker-push]
    uses: "./.github/workflows/job_helm_push.yaml"
    permissions:
      contents: "read"
      id-token: "write"
    secrets: inherit
    with:
      helm_chart: "zero-power-tags/charts"
