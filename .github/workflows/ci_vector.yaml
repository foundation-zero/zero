name: "Vector: Test and Deploy"
on:
  pull_request:
    paths:
      - .github/workflows/ci_vector.yaml
      - vector/**
  release:
    types: [released]
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci_vector.yaml
      - vector/**

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: "0"
      - name: Run Vector test
        working-directory: vector
        run: bash test.sh
      - name: Run Vector ATPX test
        working-directory: vector
        run: bash test-atpx.sh
      - name: Run Vector ATPX NMEA test
        working-directory: vector
        run: bash test-atpx-nmea.sh
  helm-push:
    if: ${{ github.event_name == 'release' ||  github.ref == 'refs/heads/main' }}
    needs: test
    uses: "./.github/workflows/job_helm_push.yaml"
    permissions:
      contents: "read"
      id-token: "write"
    secrets: inherit
    with:
      helm_chart: "vector/"
