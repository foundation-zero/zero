name: "MQTT GraphQL: Test and push Docker image"
on:
  pull_request:
    paths:
      - zero-mqtt-graphql/**
      - zero-modbus-bridge/**
      - zero-termodinamica/**
      - zero-power-tags/**
      - zero-hull-temperature/**
      - zero-atpx-nmea/**
      - zero-data/**
      - zero-fiber-optics/**
      - zero-thrs-control/**
      - .github/workflows/ci_mqtt_graphql.yaml
      - .github/actions/registry-cache/**
      - .github/actions/coverage-report/**
  push:
    branches:
      - main
    paths:
      - zero-mqtt-graphql/**
      - zero-modbus-bridge/**
      - zero-termodinamica/**
      - zero-power-tags/**
      - zero-hull-temperature/**
      - zero-atpx-nmea/**
      - zero-data/**
      - zero-fiber-optics/**
      - zero-thrs-control/**
      - .github/workflows/ci_mqtt_graphql.yaml
      - .github/actions/registry-cache/**
      - .github/actions/coverage-report/**
  release:
    types: [released]

env:
  IMAGE: "europe-west1-docker.pkg.dev/common-449414/common/zero-mqtt-graphql"

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: 3.15
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov
      - name: Sync termodinamica
        run: uv sync --locked
        working-directory: zero-termodinamica
      - name: Sync power-tags
        run: uv sync --locked
        working-directory: zero-power-tags
      - name: Sync hull-temperature
        run: uv sync --locked
        working-directory: zero-hull-temperature
      - name: Sync thrs-control
        run: uv sync --locked
        working-directory: zero-thrs-control
      - name: Sync atpx-nmea
        run: uv sync --locked
        working-directory: zero-atpx-nmea
      - name: Sync data
        run: uv sync --locked
        working-directory: zero-data
      - name: Aggregate AsyncAPI specs
        run: bash scripts/aggregate-specs.sh
        env:
          AGGREGATE_STRICT: "1"
      - name: Check formatting
        run: cargo fmt --check
        working-directory: zero-mqtt-graphql
      - name: Test zero-mqtt-graphql
        run: just test --cobertura --output-path coverage.xml
        working-directory: zero-mqtt-graphql
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-zero-mqtt-graphql
          path: zero-mqtt-graphql/coverage.xml
          retention-days: 90
      - name: Clippy zero-mqtt-graphql
        run: cargo clippy --all --all-features --locked
        working-directory: zero-mqtt-graphql
      - name: Build zero-mqtt-graphql binary
        run: cargo build --locked
        working-directory: zero-mqtt-graphql
      - name: Validate specs (no sanitization collisions)
        run: cargo run --locked -- validate --spec-dir ../specs
        working-directory: zero-mqtt-graphql
      - name: Copy specs into image build context
        run: cp -r specs zero-mqtt-graphql/specs
      - name: Upload specs artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: specs
          path: zero-mqtt-graphql/specs/
      - name: Generate Version
        id: version
        uses: ./.github/actions/generate-version

  coverage:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: "read"
      actions: "read"
      pull-requests: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-zero-mqtt-graphql
          path: ${{ runner.temp }}/coverage
      - uses: ./.github/actions/coverage-report
        with:
          project: zero-mqtt-graphql
          report-dir: ${{ runner.temp }}/coverage

  docker-push:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          token_format: access_token
          project_id: ${{ secrets.GCP_COMMON_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_COMMON_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_COMMON_SERVICE_ACCOUNT }}
          access_token_lifetime: 600s
      - name: Login to Artifact Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Download specs artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: specs
          path: zero-mqtt-graphql/specs
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.test.outputs.version }}
      - name: Build cache
        id: cache
        uses: ./.github/actions/registry-cache
        with:
          image: ${{ env.IMAGE }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: zero-mqtt-graphql
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ steps.cache.outputs.cache-from }}
          cache-to: ${{ steps.cache.outputs.cache-to }}
  helm-push:
    if: ${{ github.event_name == 'release' ||  github.ref == 'refs/heads/main' }}
    needs: docker-push
    uses: "./.github/workflows/job_helm_push.yaml"
    permissions:
      contents: "read"
      id-token: "write"
    secrets: inherit
    with:
      helm_chart: "zero-mqtt-graphql/charts"
