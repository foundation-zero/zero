name: "MQTT GraphQL: Test and push Docker image"
on:
  pull_request:
    paths:
      - zero-mqtt-graphql/**
      - zero-modbus-bridge/**
      - zero-termodinamica/**
      - zero-power-tags/**
      - zero-hull-temperature/**
      - zero-atpx-nmea/**
      - zero-data/**
      - zero-thrs-control/**
      - .github/workflows/ci_mqtt_graphql.yaml
      - .github/actions/coverage-report/**
  push:
    branches:
      - main
    paths:
      - zero-mqtt-graphql/**
      - zero-modbus-bridge/**
      - zero-termodinamica/**
      - zero-power-tags/**
      - zero-hull-temperature/**
      - zero-atpx-nmea/**
      - zero-data/**
      - zero-thrs-control/**
      - .github/workflows/ci_mqtt_graphql.yaml
      - .github/actions/coverage-report/**
  release:
    types: [released]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: 3.15
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          components: clippy, rustfmt, llvm-tools-preview
          cache-workspaces: zero-mqtt-graphql
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-llvm-cov
      - name: Sync termodinamica
        run: uv sync --locked
        working-directory: zero-termodinamica
      - name: Sync power-tags
        run: uv sync --locked
        working-directory: zero-power-tags
      - name: Sync hull-temperature
        run: uv sync --locked
        working-directory: zero-hull-temperature
      - name: Sync thrs-control
        run: uv sync --locked
        working-directory: zero-thrs-control
      - name: Sync atpx-nmea
        run: uv sync --locked
        working-directory: zero-atpx-nmea
      - name: Sync data
        run: uv sync --locked
        working-directory: zero-data
      - name: Aggregate AsyncAPI specs
        run: bash scripts/aggregate-specs.sh
        env:
          AGGREGATE_STRICT: "1"
      - name: Check formatting
        run: just format
        working-directory: zero-mqtt-graphql
      - name: Clippy zero-mqtt-graphql
        run: just lint
        working-directory: zero-mqtt-graphql
      - name: Test zero-mqtt-graphql
        run: just test
        working-directory: zero-mqtt-graphql
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-zero-mqtt-graphql
          path: zero-mqtt-graphql/target/coverage/coverage.xml
          retention-days: 90
      - name: Build zero-mqtt-graphql binary
        run: cargo build --locked
        working-directory: zero-mqtt-graphql
      - name: Validate specs (no sanitization collisions)
        run: just validate
        working-directory: zero-mqtt-graphql
      - name: Copy specs into image build context
        run: cp -r specs zero-mqtt-graphql/specs
      - name: Upload specs artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: specs
          path: zero-mqtt-graphql/specs/

  coverage:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: "read"
      actions: "read"
      pull-requests: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-zero-mqtt-graphql
          path: ${{ runner.temp }}/coverage
      - uses: ./.github/actions/coverage-report
        with:
          project: zero-mqtt-graphql
          report-dir: ${{ runner.temp }}/coverage

  docker-push:
    needs: test
    uses: "./.github/workflows/job_docker_push.yaml"
    permissions:
      contents: "read"
      id-token: "write"
    secrets: inherit
    with:
      image: "zero-mqtt-graphql"
      context: "zero-mqtt-graphql"
      artifact-name: "specs"
  helm-push:
    if: ${{ github.event_name == 'release' ||  github.ref == 'refs/heads/main' }}
    needs: docker-push
    uses: "./.github/workflows/job_helm_push.yaml"
    permissions:
      contents: "read"
      id-token: "write"
    secrets: inherit
    with:
      helm_chart: "zero-mqtt-graphql/charts"
