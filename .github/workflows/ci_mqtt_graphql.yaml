name: "MQTT GraphQL: Test and push Docker image"
on:
  pull_request:
    paths:
      - zero-mqtt-graphql/**
      - zero-modbus-bridge/**
      - zero-termodinamica/**
      - zero-power-tags/**
      - zero-hull-temperature/**
      - zero-atpx-nmea/**
      - zero-data/**
      - zero-fiber-optics/**
      - .github/workflows/ci_mqtt_graphql.yaml
  push:
    branches:
      - main
    paths:
      - zero-mqtt-graphql/**
      - zero-modbus-bridge/**
      - zero-termodinamica/**
      - zero-power-tags/**
      - zero-hull-temperature/**
      - zero-atpx-nmea/**
      - zero-data/**
      - zero-fiber-optics/**
      - .github/workflows/ci_mqtt_graphql.yaml
  release:
    types: [released]

env:
  IMAGE: "europe-west1-docker.pkg.dev/common-449414/common/zero-mqtt-graphql"

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: "0"
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - name: Sync termodinamica
        run: uv sync --locked
        working-directory: zero-termodinamica
      - name: Sync power-tags
        run: uv sync --locked
        working-directory: zero-power-tags
      - name: Sync hull-temperature
        run: uv sync --locked
        working-directory: zero-hull-temperature
      - name: Sync atpx-nmea
        run: uv sync --locked
        working-directory: zero-atpx-nmea
      - name: Sync data
        run: uv sync --locked
        working-directory: zero-data
      - name: Aggregate AsyncAPI specs
        run: bash scripts/aggregate-specs.sh
        env:
          AGGREGATE_STRICT: "1"
      - name: Check formatting
        run: cargo fmt --check
        working-directory: zero-mqtt-graphql
      - name: Test zero-mqtt-graphql
        run: cargo test --locked
        working-directory: zero-mqtt-graphql
      - name: Clippy zero-mqtt-graphql
        run: cargo clippy --all --all-features --locked
        working-directory: zero-mqtt-graphql
      - name: Build zero-mqtt-graphql binary
        run: cargo build --locked
        working-directory: zero-mqtt-graphql
      - name: Validate specs (no sanitization collisions)
        run: cargo run --locked -- validate --spec-dir ../specs
        working-directory: zero-mqtt-graphql
      - name: Copy specs into image build context
        run: cp -r specs zero-mqtt-graphql/specs
      - name: Upload specs artifact
        uses: actions/upload-artifact@v4
        with:
          name: specs
          path: zero-mqtt-graphql/specs/
      - name: Generate Version
        id: version
        uses: ./.github/actions/generate-version

  docker-push:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@v4
      - id: auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          project_id: ${{ secrets.GCP_COMMON_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_COMMON_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_COMMON_SERVICE_ACCOUNT }}
          access_token_lifetime: 600s
      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Download specs artifact
        uses: actions/download-artifact@v4
        with:
          name: specs
          path: zero-mqtt-graphql/specs
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.test.outputs.version }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: zero-mqtt-graphql
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  helm-push:
    if: ${{ github.event_name == 'release' ||  github.ref == 'refs/heads/main' }}
    needs: docker-push
    uses: "./.github/workflows/job_helm_push.yaml"
    permissions:
      contents: "read"
      id-token: "write"
    secrets: inherit
    with:
      helm_chart: "zero-mqtt-graphql/charts"
