name: "Modbus Bridge: Test"
on:
  pull_request:
    paths:
      - zero-modbus-bridge/**
      - .github/workflows/ci_modbus_bridge.yaml
  push:
    branches:
      - main
    paths:
      - zero-modbus-bridge/**
      - .github/workflows/ci_modbus_bridge.yaml

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: 3.13
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: uv sync --locked --extra tui
        working-directory: zero-modbus-bridge
      - run: just lint_no_fix
        working-directory: zero-modbus-bridge
      - run: just type_check
        working-directory: zero-modbus-bridge
      - run: just test
        working-directory: zero-modbus-bridge
