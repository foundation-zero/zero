name: "Modbus Bridge: Test"
on:
  pull_request:
    paths:
      - zero-modbus-bridge/**
      - .github/workflows/ci_modbus_bridge.yaml
  push:
    branches:
      - main
    paths:
      - zero-modbus-bridge/**
      - .github/workflows/ci_modbus_bridge.yaml

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: "0"
      - uses: actions/setup-python@v7
        with:
          python-version: 3.15
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: extractions/setup-just@v4
      - run: uv sync --locked --extra tui
        working-directory: zero-modbus-bridge
      - run: just lint_no_fix
        working-directory: zero-modbus-bridge
      - run: just type_check
        working-directory: zero-modbus-bridge
      - run: just test
        working-directory: zero-modbus-bridge
