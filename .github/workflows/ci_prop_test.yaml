name: "Prop Test: Test and push Docker image"
on:
  pull_request:
    paths:
      - zero-prop-test/**
      - .github/workflows/ci_prop_test.yaml
  release:
    types: [released]
  push:
    branches:
      - main
    paths:
      - zero-prop-test/**
      - .github/workflows/ci_prop_test.yaml

env:
  IMAGE: "europe-west1-docker.pkg.dev/common-449414/common/zero-prop-test"

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image_tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: "0"
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - run: pipx install poetry==2.2.1
      - run: poetry check
        working-directory: zero-prop-test
      - run: poetry install --with dev,test
        working-directory: zero-prop-test
      - run: poetry run ruff check src tests
        working-directory: zero-prop-test
      - run: poetry run ruff format --check src tests
        working-directory: zero-prop-test
      - run: poetry run pyright
        working-directory: zero-prop-test
      - run: poetry run pytest -v
        working-directory: zero-prop-test
      - name: Determine image tag
        id: image_tag
        run: |
          VERSION=$(poetry version -s | sed -r 's/\+/_/g')
          echo "Using image tag: $VERSION"
          echo "image_tag=$VERSION" >> $GITHUB_OUTPUT
        working-directory: zero-prop-test

  docker-push:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@v4
      # Set up in https://github.com/foundation-zero/gcp-common
      - id: auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          project_id: ${{ secrets.GCP_COMMON_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_COMMON_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_COMMON_SERVICE_ACCOUNT }}
          access_token_lifetime: 600s
      - run: gcloud auth configure-docker europe-west1-docker.pkg.dev
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: zero-prop-test/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:${{ needs.test.outputs.image_tag }}
