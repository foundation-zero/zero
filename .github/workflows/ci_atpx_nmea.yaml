name: "ATPX NMEA: Test and push Docker image"
on:
  pull_request:
    paths:
      - zero-atpx-nmea/**
      - .github/workflows/ci_atpx_nmea.yaml
  release:
    types: [released]
  push:
    branches:
      - main
    paths:
      - zero-atpx-nmea/**
      - .github/workflows/ci_atpx_nmea.yaml

env:
  IMAGE: "europe-west1-docker.pkg.dev/common-449414/common/zero-atpx-nmea"

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: "0"
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --locked
        working-directory: zero-atpx-nmea
      - run: uv run ruff check --no-fix
        working-directory: zero-atpx-nmea
      - run: uv run ruff format --check src tests
        working-directory: zero-atpx-nmea
      - run: uv run pyright
        working-directory: zero-atpx-nmea
      - run: uv run pytest
        working-directory: zero-atpx-nmea
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @asyncapi/cli@6.0.2
        working-directory: zero-atpx-nmea
      - name: AsyncAPI CLI validation
        run: asyncapi validate asyncapi.json
        working-directory: zero-atpx-nmea

  docker-push:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@v4
      - id: auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          project_id: ${{ secrets.GCP_COMMON_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_COMMON_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_COMMON_SERVICE_ACCOUNT }}
          access_token_lifetime: 600s
      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Generate Version
        id: version
        uses: ./.github/actions/generate-version
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: zero-atpx-nmea/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  helm-push:
    if: ${{ github.event_name == 'release' ||  github.ref == 'refs/heads/main' }}
    needs: docker-push
    uses: "./.github/workflows/job_helm_push.yaml"
    permissions:
      contents: "read"
      id-token: "write"
    secrets: inherit
    with:
      helm_chart: "zero-atpx-nmea/charts"
