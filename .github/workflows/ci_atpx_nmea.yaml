name: "ATPX NMEA: Test and push Docker image"
on:
  pull_request:
    paths:
      - zero-atpx-nmea/**
      - .github/workflows/ci_atpx_nmea.yaml
      - .github/actions/coverage-report/**
  release:
    types: [released]
  push:
    branches:
      - main
    paths:
      - zero-atpx-nmea/**
      - .github/workflows/ci_atpx_nmea.yaml
      - .github/actions/coverage-report/**

env:
  IMAGE: "europe-west1-docker.pkg.dev/common-449414/common/zero-atpx-nmea"
  CACHE: "europe-west1-docker.pkg.dev/common-449414/buildcache/zero-atpx-nmea:main"

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: 3.15
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: uv sync --locked
        working-directory: zero-atpx-nmea
      - run: just lint_no_fix
        working-directory: zero-atpx-nmea
      - run: just format
        working-directory: zero-atpx-nmea
      - run: just type_check
        working-directory: zero-atpx-nmea
      - run: just test --cov-report=xml
        working-directory: zero-atpx-nmea
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-zero-atpx-nmea
          path: zero-atpx-nmea/coverage.xml
          retention-days: 90
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
      - run: npm install -g @asyncapi/cli@6.0.2
        working-directory: zero-atpx-nmea
      - name: AsyncAPI CLI validation
        run: asyncapi validate asyncapi.json
        working-directory: zero-atpx-nmea

  coverage:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: "read"
      actions: "read"
      pull-requests: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-zero-atpx-nmea
          path: ${{ runner.temp }}/coverage
      - uses: ./.github/actions/coverage-report
        with:
          project: zero-atpx-nmea
          report-dir: ${{ runner.temp }}/coverage
          fail-under: "68"

  docker-push:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          token_format: access_token
          project_id: ${{ secrets.GCP_COMMON_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_COMMON_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_COMMON_SERVICE_ACCOUNT }}
          access_token_lifetime: 600s
      - name: Login to Artifact Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Generate Version
        id: version
        uses: ./.github/actions/generate-version
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: zero-atpx-nmea/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.CACHE }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref={0},mode=max,ignore-error=true', env.CACHE) || '' }}
  helm-push:
    if: ${{ github.event_name == 'release' ||  github.ref == 'refs/heads/main' }}
    needs: docker-push
    uses: "./.github/workflows/job_helm_push.yaml"
    permissions:
      contents: "read"
      id-token: "write"
    secrets: inherit
    with:
      helm_chart: "zero-atpx-nmea/charts"
