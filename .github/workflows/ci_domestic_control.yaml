name: "Domestic Control: Test and push Docker image"
on:
  pull_request:
    paths:
      - zero-domestic-control/**
      - .github/workflows/ci_domestic_control.yaml
  release:
    types: [released]
  push:
    branches:
      - main
    paths:
      - zero-domestic-control/**
      - .github/workflows/ci_domestic_control.yaml

env:
  IMAGE: "europe-west1-docker.pkg.dev/common-449414/common/zero-domestic-control"

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image_tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: "0"
      - name: Create .env file from secret in root for services
        run: |
          echo "${{ secrets.ENV }}" > .env
      - name: Create .env file from secret in project
        run: |
          echo "${{ secrets.ENV }}" > .env
        working-directory: zero-domestic-control
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - run: pipx install poetry==2.2.1
      - run: poetry check
        working-directory: zero-domestic-control
      - uses: astral-sh/ruff-action@v3
        with:
          src: "./zero-domestic-control"
      - run: poetry install --with dev,test
        working-directory: zero-domestic-control
      - run: poetry run mypy src
        working-directory: zero-domestic-control
      - name: Unit Test
        run: poetry run pytest --run=unit
        working-directory: zero-domestic-control
      - name: Run services
        run: docker compose --profile zero up -d --quiet-pull --wait
      - name: Integration Test
        run: poetry run pytest --run=integration -vv
        working-directory: zero-domestic-control
      - name: Determine image tag
        id: image_tag
        run: |
          VERSION=$(poetry version -s | sed -r 's/\+/_/g')

          echo "Using image tag: $VERSION"
          echo "image_tag=$VERSION" >> $GITHUB_OUTPUT
        working-directory: zero-domestic-control

  docker-push:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@v4
      # Set up in https://github.com/foundation-zero/gcp-common
      - id: auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          project_id: ${{ secrets.GCP_COMMON_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_COMMON_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_COMMON_SERVICE_ACCOUNT }}
          access_token_lifetime: 600s
      - name: Login to Artifact Registry
        uses: docker/login-action@v1
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: zero-domestic-control
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:${{ needs.test.outputs.image_tag }}
