name: "Path filters: Check"
on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/scripts/check_path_filters.py
      - "**/pyproject.toml"
      - "**/Cargo.toml"
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/scripts/check_path_filters.py
      - "**/pyproject.toml"
      - "**/Cargo.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 .github/scripts/check_path_filters.py
