name: "THRS Control: Test"
on:
  pull_request:
    paths:
      - zero-thrs-control/**
      - docker-compose.yml
      - .github/workflows/ci_thrs_control.yaml
      - .github/actions/coverage-report/**
  release:
    types: [released]
  push:
    branches:
      - main
    paths:
      - zero-thrs-control/**
      - docker-compose.yml
      - .github/workflows/ci_thrs_control.yaml
      - .github/actions/coverage-report/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: 3.15
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Create .env file from secret in root for services
        run: |
          echo "${{ secrets.ENV }}" > .env

      - name: Create .env file from secret in project
        run: |
          echo "${{ secrets.ENV_THRS }}" > .env
        working-directory: zero-thrs-control

      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@b1de5da23ed0a6d14e0aeee8ed52fdd87af2363c # v2

      - run: uv sync --locked
        working-directory: zero-thrs-control

      - run: just check_static
        working-directory: zero-thrs-control

      - run: docker compose --profile thrs up -d --quiet-pull --wait vernemq

      - run: just test --cov-report=xml -v
        working-directory: zero-thrs-control

      - name: Run IO tests (non-blocking)
        run: just test_io --cov-append --cov-report=xml -v
        working-directory: zero-thrs-control
        continue-on-error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-zero-thrs-control
          path: zero-thrs-control/coverage.xml
          retention-days: 90

  coverage:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: "read"
      actions: "read"
      pull-requests: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-zero-thrs-control
          path: ${{ runner.temp }}/coverage
      - uses: ./.github/actions/coverage-report
        with:
          project: zero-thrs-control
          report-dir: ${{ runner.temp }}/coverage

  docker-push:
    strategy:
      matrix:
        target: [control, api]
    uses: "./.github/workflows/job_docker_push.yaml"
    permissions:
      contents: "read"
      id-token: "write"
    secrets: inherit
    with:
      image: "zero-thrs-${{ matrix.target }}"
      context: "zero-thrs-control"
      target: "${{ matrix.target }}"
  helm-push:
    if: ${{ github.event_name == 'release' ||  github.ref == 'refs/heads/main' }}
    needs: [test, docker-push]
    uses: "./.github/workflows/job_helm_push.yaml"
    permissions:
      contents: "read"
      id-token: "write"
    secrets: inherit
    with:
      helm_chart: "zero-thrs-control/charts/zero-thrs-control"
