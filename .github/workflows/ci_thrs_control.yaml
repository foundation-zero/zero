name: "THRS Control: Test"
on:
  pull_request:
    paths:
      - zero-thrs-control/**
      - .github/workflows/ci_thrs_control.yaml
  release:
    types: [released]
  push:
    branches:
      - main
    paths:
      - zero-thrs-control/**
      - .github/workflows/ci_thrs_control.yaml

env:
  IMAGE_PREFIX: "europe-west1-docker.pkg.dev/common-449414/common/zero-thrs-"

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image_tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: "0"

      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - uses: astral-sh/setup-uv@v8.1.0

      - uses: extractions/setup-just@v4

      - name: Create .env file from secret in root for services
        run: |
          echo "${{ secrets.ENV }}" > .env

      - name: Create .env file from secret in project
        run: |
          echo "${{ secrets.ENV_THRS }}" > .env
        working-directory: zero-thrs-control

      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@v2

      - run: uv sync --locked
        working-directory: zero-thrs-control

      - run: just type_check
        working-directory: zero-thrs-control

      - run: just lint
        working-directory: zero-thrs-control

      - run: just format
        working-directory: zero-thrs-control

      - run: docker compose --profile thrs up -d --quiet-pull --wait vernemq

      - run: just test -v
        working-directory: zero-thrs-control

      - name: Run IO tests (non-blocking)
        run: just test_io -v
        working-directory: zero-thrs-control
        continue-on-error: true

      - name: Determine image tag
        id: image_tag
        run: |
          VERSION=$(uvx hatch version | sed 's/+/_/g')

          echo "Using image tag: $VERSION"
          echo "image_tag=$VERSION" >> $GITHUB_OUTPUT
        working-directory: zero-thrs-control

  docker-push:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        target: [control, api]
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@v4
      # Set up in https://github.com/foundation-zero/gcp-common
      - id: auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          project_id: ${{ secrets.GCP_COMMON_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_COMMON_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_COMMON_SERVICE_ACCOUNT }}
          access_token_lifetime: 900s
      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: zero-thrs-control
          push: true
          platforms: linux/amd64,linux/arm64
          target: ${{matrix.target}}
          tags: ${{ env.IMAGE_PREFIX }}${{matrix.target}}:${{ needs.test.outputs.image_tag }}
