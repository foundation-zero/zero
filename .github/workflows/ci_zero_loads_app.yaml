name: "Zero Loads App: Test and push Docker image"
on:
  pull_request:
    paths:
      - zero-loads-app/**
      - data/**
      - zero-generator/**
      - hasura/seeds/zero/loads_reference_values.sql
      - hasura/seeds/zero/loads_case_mappings.sql
      - .github/workflows/ci_zero_loads_app.yaml
  release:
    types: [released]
  push:
    branches:
      - main
    paths:
      - zero-loads-app/**
      - data/**
      - zero-generator/**
      - hasura/seeds/zero/loads_reference_values.sql
      - hasura/seeds/zero/loads_case_mappings.sql
      - .github/workflows/ci_zero_loads_app.yaml

env:
  IMAGE: "europe-west1-docker.pkg.dev/common-449414/common/zero-loads-app"

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: "0"
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --locked
        working-directory: zero-loads-app
      - run: uv run ruff check --no-fix src tests
        working-directory: zero-loads-app
      - run: uv run ruff format --check src tests
        working-directory: zero-loads-app
      - run: uv run pyright
        working-directory: zero-loads-app
      - name: Create .env file from secret in root for services
        run: |
          echo "${{ secrets.ENV }}" > .env
      - name: Create .env file from secret in project
        run: |
          echo "${{ secrets.ENV_LOADS_APP }}" > .env
        working-directory: zero-loads-app
      - name: Unit Test
        run: uv run pytest --run=unit -vv
        working-directory: zero-loads-app
      - name: Check seeds are consistent with sailpack export
        run: uv run loads check-seed
        working-directory: zero-loads-app
      - name: Run services
        run: docker compose --profile zero up -d --quiet-pull --wait postgres vernemq
        working-directory: zero-loads-app
      - name: Set up postgres schema
        run: docker compose --profile zero up -d --wait hasura
        working-directory: zero-loads-app
      - name: Install Hasura CLI
        run: curl -L https://github.com/hasura/graphql-engine/raw/stable/cli/get.sh | bash
      - name: Seed reference values
        run: hasura seed apply --file loads_reference_values.sql --endpoint http://localhost:8080 --admin-secret myadminsecretkey --database-name zero
        working-directory: hasura
      - name: Seed case mappings
        run: hasura seed apply --file loads_case_mappings.sql --endpoint http://localhost:8080 --admin-secret myadminsecretkey --database-name zero
        working-directory: hasura
      - name: Integration Test
        run: uv run pytest --run=integration -vv
        working-directory: zero-loads-app

  docker-push:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@v5
      # Set up in https://github.com/foundation-zero/gcp-common
      - id: auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          project_id: ${{ secrets.GCP_COMMON_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_COMMON_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_COMMON_SERVICE_ACCOUNT }}
          access_token_lifetime: 600s
      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Generate Version
        id: version
        uses: ./.github/actions/generate-version
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: zero-loads-app/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  helm-push:
    if: ${{ github.event_name == 'release' ||  github.ref == 'refs/heads/main' }}
    needs: docker-push
    uses: "./.github/workflows/job_helm_push.yaml"
    permissions:
      contents: "read"
      id-token: "write"
    secrets: inherit
    with:
      helm_chart: "zero-loads-app/charts"
