name: "Zero Loads App: Test and push Docker image"
on:
  pull_request:
    paths:
      - zero-loads-app/**
      - zero-generator/**
      - hasura/seeds/zero/loads.sql
      - zero-ui/src/modules/loads/lib/consts.dashboards.ts
      - .github/workflows/ci_zero_loads_app.yaml
      - .github/actions/coverage-report/**
  release:
    types: [released]
  push:
    branches:
      - main
    paths:
      - zero-loads-app/**
      - zero-generator/**
      - hasura/seeds/zero/loads.sql
      - zero-ui/src/modules/loads/lib/consts.dashboards.ts
      - .github/workflows/ci_zero_loads_app.yaml
      - .github/actions/coverage-report/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: 3.15
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: uv sync --locked
        working-directory: zero-loads-app
      - run: just lint_no_fix
        working-directory: zero-loads-app
      - run: just format
        working-directory: zero-loads-app
      - run: just type_check
        working-directory: zero-loads-app
      - name: Create .env file from secret in root for services
        run: |
          echo "${{ secrets.ENV }}" > .env
      - name: Create .env file from secret in project
        run: |
          echo "${{ secrets.ENV_LOADS_APP }}" > .env
        working-directory: zero-loads-app
      - name: Unit Test
        run: just test_unit -vv
        working-directory: zero-loads-app
      - name: Check seeds are consistent with sailpack export
        continue-on-error: true
        run: just check_seed
        working-directory: zero-loads-app
      - name: Run services
        run: docker compose --profile zero up -d --quiet-pull --wait postgres vernemq
        working-directory: zero-loads-app
      - name: Set up postgres schema
        run: docker compose --profile zero up -d --wait hasura
        working-directory: zero-loads-app
      - name: Install Hasura CLI
        run: curl -L https://github.com/hasura/graphql-engine/raw/stable/cli/get.sh | bash
      - name: Seed loads
        run: hasura seed apply --file loads.sql --endpoint http://localhost:8080 --admin-secret myadminsecretkey --database-name zero
        working-directory: hasura
      - name: Integration Test
        run: just test_integration --cov-append --cov-report=xml -vv
        working-directory: zero-loads-app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-zero-loads-app
          path: zero-loads-app/coverage.xml
          retention-days: 90

  coverage:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: "read"
      actions: "read"
      pull-requests: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-zero-loads-app
          path: ${{ runner.temp }}/coverage
      - uses: ./.github/actions/coverage-report
        with:
          project: zero-loads-app
          report-dir: ${{ runner.temp }}/coverage
          fail-under: "71"

  docker-push:
    uses: "./.github/workflows/job_docker_push.yaml"
    permissions:
      contents: "read"
      id-token: "write"
    secrets: inherit
    with:
      image: "zero-loads-app"
      context: "."
      dockerfile: "zero-loads-app/Dockerfile"
  helm-push:
    if: ${{ github.event_name == 'release' ||  github.ref == 'refs/heads/main' }}
    needs: [test, docker-push]
    uses: "./.github/workflows/job_helm_push.yaml"
    permissions:
      contents: "read"
      id-token: "write"
    secrets: inherit
    with:
      helm_chart: "zero-loads-app/charts"
