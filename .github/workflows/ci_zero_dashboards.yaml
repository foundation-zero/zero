name: "Zero Dashboards: Build and push Docker image"
on:
  pull_request:
    paths:
      - zero-dashboards/**
      - .github/workflows/ci_zero_dashboards.yaml
  release:
    types: [released]
  push:
    branches:
      - main
    paths:
      - zero-dashboards/**
      - .github/workflows/ci_zero_dashboards.yaml

env:
  IMAGE: "europe-west1-docker.pkg.dev/common-449414/common/grafana-zero-dashboards"

jobs:
  docker-push:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@v5
      # Set up in https://github.com/foundation-zero/gcp-common
      - id: auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          project_id: ${{ secrets.GCP_COMMON_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_COMMON_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_COMMON_SERVICE_ACCOUNT }}
          access_token_lifetime: 300s
      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: zero-dashboards
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
