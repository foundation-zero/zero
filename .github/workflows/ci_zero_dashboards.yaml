name: "Zero Dashboards: Build and push Docker image"
on:
  pull_request:
    paths:
      - zero-dashboards/**
      - .github/workflows/ci_zero_dashboards.yaml
  release:
    types: [released]
  push:
    branches:
      - main
    paths:
      - zero-dashboards/**
      - .github/workflows/ci_zero_dashboards.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-push:
    uses: "./.github/workflows/job_docker_push.yaml"
    permissions:
      contents: "read"
      id-token: "write"
    secrets: inherit
    with:
      image: "grafana-zero-dashboards"
      context: "zero-dashboards"
      platforms: "linux/amd64"
