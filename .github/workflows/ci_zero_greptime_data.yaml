name: "Zero Greptime Data: Lint, typecheck and test"
on:
  pull_request:
    paths:
      - zero-greptime-data/**
      - .github/workflows/ci_zero_greptime_data.yaml
  push:
    branches:
      - main
    paths:
      - zero-greptime-data/**
      - .github/workflows/ci_zero_greptime_data.yaml

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zero-greptime-data
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: "0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --locked
      - run: uv run ruff check --no-fix src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src tests
      # Spin a local Greptime (same image/version/ports as prod). Entirely offline:
      # the integration tests load the committed snapshot and run `dbt build` against it,
      # with no live MQTT data.
      - name: Start local GreptimeDB
        run: docker compose up -d --wait
      - name: Integration tests (snapshot round-trip + dbt build)
        run: uv run pytest .
      - name: Stop local GreptimeDB
        if: always()
        run: docker compose down -v
