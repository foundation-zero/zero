name: "Zero Browser Kiosk: Push Docker image"
on:
  pull_request:
    paths:
      - zero-browser-kiosk/**
      - .github/workflows/ci_zero_browser_kiosk.yaml
  release:
    types: [released]
  push:
    branches:
      - main
    paths:
      - zero-browser-kiosk/**
      - .github/workflows/ci_zero_browser_kiosk.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-push:
    uses: "./.github/workflows/job_docker_push.yaml"
    permissions:
      contents: "read"
      id-token: "write"
    secrets: inherit
    with:
      image: "zero-browser-kiosk"
      context: "zero-browser-kiosk"
  helm-push:
    if: ${{ github.event_name == 'release' ||  github.ref == 'refs/heads/main' }}
    needs: docker-push
    uses: "./.github/workflows/job_helm_push.yaml"
    permissions:
      contents: "read"
      id-token: "write"
    secrets: inherit
    with:
      helm_chart: "zero-browser-kiosk/charts"
