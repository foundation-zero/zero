name: "Zero Readiness: Test"
on:
  pull_request:
    paths:
      - packages/rust/zero-readiness/**
      - .github/workflows/ci_zero_readiness.yaml
      - .github/actions/coverage-report/**
  push:
    branches:
      - main
    paths:
      - packages/rust/zero-readiness/**
      - .github/workflows/ci_zero_readiness.yaml
      - .github/actions/coverage-report/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"

      # Toolchain and components come from packages/rust/zero-readiness/rust-toolchain.toml.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          rust-src-dir: packages/rust/zero-readiness
          cache-workspaces: packages/rust/zero-readiness

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov

      - name: Check formatting and lint
        run: just format lint
        working-directory: packages/rust/zero-readiness

      - name: Test
        run: just test --cobertura --output-path coverage.xml
        working-directory: packages/rust/zero-readiness

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-zero-readiness
          path: packages/rust/zero-readiness/coverage.xml
          retention-days: 90

  coverage:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: "read"
      actions: "read"
      pull-requests: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-zero-readiness
          path: ${{ runner.temp }}/coverage
      - uses: ./.github/actions/coverage-report
        with:
          project: zero-readiness
          report-dir: ${{ runner.temp }}/coverage
