name: "Hull temperature: Test and push Docker image"
on:
  pull_request:
    paths:
      - zero-modbus-bridge/**
      - zero-hull-temperature/**
      - docker-compose.yml
      - hass/**
      - hasura/**
      - .github/workflows/ci_hull_temperature.yaml
      - .github/actions/coverage-report/**
  release:
    types: [released]
  push:
    branches:
      - main
    paths:
      - zero-modbus-bridge/**
      - zero-hull-temperature/**
      - docker-compose.yml
      - hass/**
      - hasura/**
      - .github/workflows/ci_hull_temperature.yaml
      - .github/actions/coverage-report/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: 3.15
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: uv sync --locked
        working-directory: zero-hull-temperature
      - run: just lint_no_fix
        working-directory: zero-hull-temperature
      - run: just type_check
        working-directory: zero-hull-temperature
      - name: Create .env file from secret in root for services
        run: |
          echo "${{ secrets.ENV }}" > .env
      - name: Run services
        run: docker compose --profile zero up -d --quiet-pull --wait
      - name: Unit Test
        run: just test --cov-report=xml
        working-directory: zero-hull-temperature
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-zero-hull-temperature
          path: zero-hull-temperature/coverage.xml
          retention-days: 90
      - name: Run stub
        run: |
          uv run python -m zero_hull_temperature stub --mqtt-host localhost --mqtt-port 1883 --modbus-host localhost --modbus-port 11502 --seconds 30 &
          sleep 2
        working-directory: zero-hull-temperature
      - name: Read once
        run: timeout 45s uv run python -m zero_hull_temperature read-with-mqtt --mqtt-host localhost --mqtt-port 1883 --modbus-host localhost --modbus-port 11502
        working-directory: zero-hull-temperature

  coverage:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: "read"
      actions: "read"
      pull-requests: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-zero-hull-temperature
          path: ${{ runner.temp }}/coverage
      - uses: ./.github/actions/coverage-report
        with:
          project: zero-hull-temperature
          report-dir: ${{ runner.temp }}/coverage
          fail-under: "75"

  docker-push:
    uses: "./.github/workflows/job_docker_push.yaml"
    permissions:
      contents: "read"
      id-token: "write"
    secrets: inherit
    with:
      image: "zero-hull-temperature"
      context: "."
      dockerfile: "zero-hull-temperature/Dockerfile"
  helm-push:
    if: ${{ github.event_name == 'release' ||  github.ref == 'refs/heads/main' }}
    needs: [test, docker-push]
    uses: "./.github/workflows/job_helm_push.yaml"
    permissions:
      contents: "read"
      id-token: "write"
    secrets: inherit
    with:
      helm_chart: "zero-hull-temperature/charts"
