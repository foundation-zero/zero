name: "Hull temperature: Test and push Docker image"
on:
  pull_request:
    paths:
      - zero-hull-temperature/**
      - .github/workflows/ci_hull_temperature.yaml
  release:
    types: [released]
  push:
    branches:
      - main
    paths:
      - zero-hull-temperature/**
      - .github/workflows/ci_hull_temperature.yaml

env:
  IMAGE: "europe-west1-docker.pkg.dev/common-449414/common/zero-hull-temperature"

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image_tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: "0"
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --locked
        working-directory: zero-hull-temperature
      - run: uv run ruff check zero_hull_temperature tests
        working-directory: zero-hull-temperature
      - run: uv run pyright
        working-directory: zero-hull-temperature
      - name: Create .env file from secret in root for services
        run: |
          echo "${{ secrets.ENV }}" > .env
      - name: Run services
        run: docker compose --profile zero up -d --quiet-pull --wait
      - name: Unit Test
        run: uv run pytest
        working-directory: zero-hull-temperature
      - name: Run stub
        run: uv run python -m zero_hull_temperature stub --mqtt-host localhost --mqtt-port 1883 --modbus-host localhost --modbus-port 11502 --seconds 30&
        working-directory: zero-hull-temperature
      - name: Read
        run: uv run python -m zero_hull_temperature run --mqtt-host localhost --mqtt-port 1883 --modbus-host localhost --modbus-port 11502 --seconds 10 -n 1 --send-topic hull-temperature/temperatures
        working-directory: zero-hull-temperature

      - name: Determine image tag
        id: image_tag
        run: |
          VERSION=$(uvx hatch version | sed 's/+/_/g')

          echo "Using image tag: $VERSION"
          echo "image_tag=$VERSION" >> $GITHUB_OUTPUT
        working-directory: zero-hull-temperature

  docker-push:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@v4
      # Set up in https://github.com/foundation-zero/gcp-common
      - id: auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          project_id: ${{ secrets.GCP_COMMON_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_COMMON_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_COMMON_SERVICE_ACCOUNT }}
          access_token_lifetime: 600s
      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: zero-hull-temperature
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:${{ needs.test.outputs.image_tag }}
