name: "Termodinamica: Test and push Docker image"
on:
  pull_request:
    paths:
      - zero-modbus-bridge/**
      - zero-termodinamica/**
      - .github/workflows/ci_termodinamica.yaml
      - .github/actions/registry-cache/**
      - .github/actions/coverage-report/**
  release:
    types: [released]
  push:
    branches:
      - main
    paths:
      - zero-modbus-bridge/**
      - zero-termodinamica/**
      - .github/workflows/ci_termodinamica.yaml
      - .github/actions/registry-cache/**
      - .github/actions/coverage-report/**

env:
  IMAGE: "europe-west1-docker.pkg.dev/common-449414/common/zero-termodinamica"

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: 3.15
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
        working-directory: zero-termodinamica
      - run: just lint
        working-directory: zero-termodinamica
      - run: just type_check
        working-directory: zero-termodinamica
      - name: Tests
        run: just test --cov-report=xml
        working-directory: zero-termodinamica
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-zero-termodinamica
          path: zero-termodinamica/coverage.xml
          retention-days: 90

  coverage:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: "read"
      actions: "read"
      pull-requests: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-zero-termodinamica
          path: ${{ runner.temp }}/coverage
      - uses: ./.github/actions/coverage-report
        with:
          project: zero-termodinamica
          report-dir: ${{ runner.temp }}/coverage
          fail-under: "72"

  docker-push:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Set up in https://github.com/foundation-zero/gcp-common
      - id: auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          token_format: access_token
          project_id: ${{ secrets.GCP_COMMON_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_COMMON_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_COMMON_SERVICE_ACCOUNT }}
          access_token_lifetime: 600s
      - name: Login to Artifact Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Generate Version
        id: version
        uses: ./.github/actions/generate-version
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
      - name: Build cache
        id: cache
        uses: ./.github/actions/registry-cache
        with:
          image: ${{ env.IMAGE }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: zero-termodinamica/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ steps.cache.outputs.cache-from }}
          cache-to: ${{ steps.cache.outputs.cache-to }}
  helm-push:
    if: ${{ github.event_name == 'release' ||  github.ref == 'refs/heads/main' }}
    needs: docker-push
    uses: "./.github/workflows/job_helm_push.yaml"
    permissions:
      contents: "read"
      id-token: "write"
    secrets: inherit
    with:
      helm_chart: "zero-termodinamica/charts"
