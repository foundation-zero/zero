name: "Zero Data: Test and push Docker image"
on:
  pull_request:
    paths:
      - zero-data/**
      - .github/workflows/ci_zero_data.yaml
  release:
    types: [released]
  push:
    branches:
      - main
    paths:
      - zero-data/**
      - .github/workflows/ci_zero_data.yaml

env:
  IMAGE: "europe-west1-docker.pkg.dev/common-449414/common/zero-data"
  GHCR_URL: "ghcr.io"

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image_tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: "0"
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --locked
        working-directory: zero-data
      - name: Determine image tag
        id: image_tag
        run: |
          VERSION=$(uvx hatch version | sed 's/+/_/g')
          echo "Using image tag: $VERSION"
          echo "image_tag=$VERSION" >> $GITHUB_OUTPUT
        working-directory: zero-data
      - run: uv run ruff check --no-fix src tests
        working-directory: zero-data
      - run: uv run ruff format --check src tests
        working-directory: zero-data
      - run: uv run mypy src tests/greptime
        working-directory: zero-data
      # Local GreptimeDB for the dbt/Greptime integration tests (tests/greptime). Entirely
      # offline: the tests load the committed snapshot and run `dbt build` against it, with
      # no live MQTT data.
      - name: Start local GreptimeDB
        run: docker compose up -d --wait
        working-directory: zero-data
      - name: Unit Test
        run: uv run pytest .
        working-directory: zero-data
      - name: Stop local GreptimeDB
        if: always()
        run: docker compose down -v
        working-directory: zero-data

  docker-push:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: "read"
      id-token: "write"
      packages: "write"
    steps:
      - uses: actions/checkout@v4
      # Set up in https://github.com/foundation-zero/gcp-common
      - id: auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          project_id: ${{ secrets.GCP_COMMON_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_COMMON_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_COMMON_SERVICE_ACCOUNT }}
          access_token_lifetime: 600s
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: gcloud auth configure-docker europe-west1-docker.pkg.dev
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - run: 'echo "$GSHEET_SA_KEY" > .gsheet-sa-key.json'
        working-directory: zero-data
        env:
          GSHEET_SA_KEY: ${{ secrets.GSHEET_SA_KEY }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: zero-data
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ needs.test.outputs.image_tag }}
            ${{ env.GHCR_URL }}/${{ github.repository }}/io_validation_tool:${{ needs.test.outputs.image_tag }}
          secret-files: |
            "gsheet_sa_key=./zero-data/.gsheet-sa-key.json"

  helm-push:
    if: ${{ github.event_name == 'release' }}
    needs: docker-push
    uses: "./.github/workflows/job_helm_push.yaml"
    permissions:
      contents: "read"
      id-token: "write"
    secrets: inherit
    with:
      helm_chart: "zero-data/charts/data_gen"
