name: "Zero Generator: Test"
on:
  pull_request:
    paths:
      - zero-generator/**
      - zero-loads-app/**
      - docker-compose.yml
      - .github/workflows/ci_generator.yaml
      - .github/actions/coverage-report/**
  release:
    types: [released]
  push:
    branches:
      - main
    paths:
      - zero-generator/**
      - zero-loads-app/**
      - docker-compose.yml
      - .github/workflows/ci_generator.yaml
      - .github/actions/coverage-report/**

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: 3.15
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: uv sync --locked
        working-directory: zero-generator
      - run: just lint_no_fix
        working-directory: zero-generator
      - run: just format
        working-directory: zero-generator
      - run: just type_check
        working-directory: zero-generator
      - name: Create .env file from secret in root
        run: |
          echo "${{ secrets.ENV }}" > .env
      - name: Run services
        run: docker compose --profile zero up -d --quiet-pull --wait vernemq
      - name: Unit Test
        run: just test --cov-report=xml . -vv
        working-directory: zero-generator
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-zero-generator
          path: zero-generator/coverage.xml
          retention-days: 90

  coverage:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: "read"
      actions: "read"
      pull-requests: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-zero-generator
          path: ${{ runner.temp }}/coverage
      - uses: ./.github/actions/coverage-report
        with:
          project: zero-generator
          report-dir: ${{ runner.temp }}/coverage
