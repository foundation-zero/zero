name: "Zero Generator: Test"
on:
  pull_request:
    paths:
      - zero-generator/**
      - zero-loads-app/**
      - .github/workflows/ci_generator.yaml
  release:
    types: [released]
  push:
    branches:
      - main
    paths:
      - zero-generator/**
      - zero-loads-app/**
      - .github/workflows/ci_generator.yaml

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: 3.15
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: uv sync --locked
        working-directory: zero-generator
      - run: just lint_no_fix
        working-directory: zero-generator
      - run: just format
        working-directory: zero-generator
      - run: just type_check
        working-directory: zero-generator
      - name: Create .env file from secret in root
        run: |
          echo "${{ secrets.ENV }}" > .env
      - name: Run services
        run: docker compose --profile zero up -d --quiet-pull --wait vernemq
      - name: Unit Test
        run: just test . -vv
        working-directory: zero-generator
