name: "Zero Generator: Test"
on:
  pull_request:
    paths:
      - zero-generator/**
      - zero-loads-app/**
      - .github/workflows/ci_generator.yaml
  release:
    types: [released]
  push:
    branches:
      - main
    paths:
      - zero-generator/**
      - zero-loads-app/**
      - .github/workflows/ci_generator.yaml

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: "0"
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: extractions/setup-just@v4
      - run: uv sync --locked
        working-directory: zero-generator
      - run: just lint_no_fix
        working-directory: zero-generator
      - run: just format
        working-directory: zero-generator
      - run: just type_check
        working-directory: zero-generator
      - name: Create .env file from secret in root
        run: |
          echo "${{ secrets.ENV }}" > .env
      - name: Run services
        run: docker compose --profile zero up -d --quiet-pull --wait vernemq
      - name: Unit Test
        run: just test . -vv
        working-directory: zero-generator
